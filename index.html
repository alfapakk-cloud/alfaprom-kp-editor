<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис генерации коммерческих предложений АЛЬФАПРОМ</title>

<style>
:root{
  --orange:#ff8100;
  --text:#202124;
  --muted:#6b7280;
  --border:#d9dce1;
  --bg:#f4f5f7;
  --green:#168a45;
  --red:#d93025;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ============================================================
   TOP
============================================================ */

.topbar{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:0 18px;
  background:#fff;
  border-bottom:2px solid var(--orange);
}

.topbar-title{
  font-size:18px;
  font-weight:700;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px 14px;
  font-weight:600;
  transition:.15s;
}

.btn:hover{
  border-color:var(--orange);
}

.btn-primary{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}

.btn-primary:hover{
  background:var(--orange);
}

.btn-danger{
  color:#b42318;
}

/* ============================================================
   MAIN
============================================================ */

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:50% 50%;
}

/* ============================================================
   EDITOR
============================================================ */

.editor{
  min-width:0;
  overflow:auto;
  padding:20px;
  background:#f7f8fa;
  border-right:1px solid #ddd;
}

.editor-section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
}

.editor-section h2{
  margin:0 0 16px;
  font-size:18px;
}

.editor-section h3{
  margin:0 0 14px;
  font-size:16px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:#40444a;
}

input[type="text"],
input[type="tel"],
input[type="number"],
input[type="url"],
textarea,
select{
  width:100%;
  border:1px solid #cfd3d8;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--orange);
}

textarea{
  min-height:90px;
  resize:vertical;
  line-height:1.45;
}

.specs-textarea{
  min-height:170px;
}

.two-cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.status-buttons{
  display:flex;
  gap:8px;
}

.status-button{
  flex:1;
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px;
  font-weight:600;
}

.status-button.active{
  border-color:var(--orange);
  box-shadow:0 0 0 1px var(--orange) inset;
}

.status-button[data-status="available"].active{
  color:var(--green);
}

.status-button[data-status="order"].active{
  color:#b96a00;
}

/* ============================================================
   PRODUCT CARD IN EDITOR
============================================================ */

.product-editor-card{
  background:#fff;
  border:1px solid #d7dbe0;
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 7px rgba(0,0,0,.035);
}

.product-editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.product-editor-title{
  font-size:18px;
  font-weight:800;
}

.product-number{
  color:var(--orange);
}

.remove-product-btn{
  border:1px solid #e0c9c6;
  background:#fff;
  color:#b42318;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
}

.remove-product-btn:hover{
  border-color:#b42318;
}

.add-product-btn{
  width:100%;
  border:1px dashed var(--orange);
  background:#fff8f0;
  color:#c86400;
  border-radius:9px;
  padding:12px;
  font-weight:700;
  margin-bottom:16px;
}

.add-product-btn:hover{
  background:#fff2e4;
}

/* ============================================================
   PHOTO
============================================================ */

.photo-editor{
  margin-bottom:16px;
}

.photo-drop{
  width:100%;
  aspect-ratio:1 / 1;
  min-height:0;
  border:2px dashed #cfd3d8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fafafa;
  overflow:hidden;
  position:relative;
  transition:.15s;
  cursor:pointer;
}

.photo-drop:hover,
.photo-drop.dragover{
  border-color:var(--orange);
  background:#fffaf5;
}

.photo-drop.has-image{
  border-style:solid;
  border-color:#d7d9dc;
  background:#fff;
}

.photo-drop img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.photo-placeholder{
  color:#73777d;
  font-size:13px;
  line-height:1.5;
  padding:20px;
}

.photo-actions{
  margin-top:8px;
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
}

.small-btn:hover{
  border-color:var(--orange);
}

.file-input{
  display:none;
}

/* ============================================================
   PREVIEW
============================================================ */

.preview-side{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#e8eaed;
}

.preview-title{
  flex:none;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
  border-bottom:1px solid #d7d9dc;
  font-size:16px;
  font-weight:700;
}

.preview-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:20px;
}

.preview-pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.preview-page-shell{
  position:relative;
  flex:none;
}

.preview-page-scaled{
  position:absolute;
  left:0;
  top:0;
  transform-origin:top left;
}

/* ============================================================
   A4
============================================================ */

.kp-page{
  width:210mm;
  height:297mm;
  background:#fff;
  position:relative;
  box-shadow:0 3px 15px rgba(0,0,0,.14);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  flex:none;
}

.kp-content{
  flex:1;
  min-height:0;
  padding:15mm 15mm 10mm;
  overflow:hidden;
}

.kp-header{
  height:31mm;
  display:flex;
  align-items:center;
  border-bottom:2px solid var(--orange);
  margin-bottom:8mm;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:34px;
  height:34px;
  background:var(--orange);
  color:#fff;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:800;
}

.brand-name{
  color:var(--orange);
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.kp-title{
  font-size:23px;
  font-weight:800;
  margin-bottom:6mm;
}

.kp-product-name{
  font-size:20px;
  font-weight:750;
  line-height:1.2;
  margin-bottom:5mm;
}

/* ============================================================
   PHOTO
============================================================ */

.product-photo-frame{
  width:100%;
  aspect-ratio:1 / 1;
  height:auto;
  border:1px solid #e0e2e5;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  margin-bottom:5mm;
}

.product-photo-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

/* ============================================================
   DESCRIPTION
============================================================ */

.kp-description{
  font-size:12.5px;
  line-height:1.55;
  white-space:pre-wrap;
  margin-bottom:4mm;
}

.kp-note{
  font-size:11.5px;
  color:#666;
  line-height:1.45;
  white-space:pre-wrap;
  margin-bottom:4mm;
}

/* ============================================================
   SPECS
============================================================ */

.specs-table{
  width:100%;
  border-collapse:collapse;
  font-size:10.5px;
  margin:3mm 0 4mm;
}

.specs-table th,
.specs-table td{
  border:1px solid #d9dce0;
  padding:5px 7px;
  text-align:left;
  vertical-align:top;
}

.specs-table th{
  background:var(--orange);
  color:#fff;
  font-weight:800;
}

.specs-table td:first-child{
  width:40%;
  font-weight:650;
}

/* ============================================================
   VIDEO
============================================================ */

.video-button{
  display:inline-block;
  margin:1mm 0 5mm;
  padding:8px 12px;
  border-radius:6px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
}

/* ============================================================
   PRICE
============================================================ */

.price-block{
  margin:3mm 0 4mm;
}

.price-line{
  font-size:17px;
  font-weight:800;
  margin-bottom:2mm;
}

.price-line.discount{
  color:var(--red);
}

.availability{
  font-size:13px;
  font-weight:800;
  margin-bottom:2mm;
}

.availability.available{
  color:var(--green);
}

.availability.order{
  color:#b96a00;
}

.price-comment{
  font-size:11px;
  color:#666;
  line-height:1.4;
  margin-bottom:4mm;
}

/* ============================================================
   WHY US
============================================================ */

.advantages{
  margin-top:auto;
  padding-top:5mm;
}

.advantages-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  margin-bottom:4mm;
}

.advantages-title::before{
  content:"";
  display:block;
  width:5px;
  height:21px;
  border-radius:3px;
  background:var(--orange);
}

.advantages-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3.5mm;
}

.advantage{
  grid-column:span 2;
  min-height:25mm;
  border:1px solid #e0e3e7;
  border-radius:9px;
  padding:4mm 3.5mm;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:16px;
  font-weight:700;
  line-height:1.25;
  background:linear-gradient(180deg,#fff 0%,#fafafa 100%);
  box-shadow:0 2px 7px rgba(0,0,0,.045);
  position:relative;
}

.advantage::before{
  content:"✓";
  position:absolute;
  top:5px;
  left:6px;
  width:19px;
  height:19px;
  border:1px solid var(--orange);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--orange);
  font-size:12px;
  font-weight:800;
}

.advantage:nth-child(4){
  grid-column:2 / span 2;
}

.advantage:nth-child(5){
  grid-column:4 / span 2;
}

/* ============================================================
   FOOTER
============================================================ */

.kp-footer{
  flex:none;
  height:25mm;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10mm;
  padding:5mm 15mm;
}

.footer-left{
  font-size:12px;
  font-weight:700;
  line-height:1.4;
}

.footer-right{
  text-align:right;
  font-size:12px;
  line-height:1.45;
}

.footer-manager{
  font-weight:800;
}

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .editor{
    border-right:0;
  }

  .preview-side{
    min-height:800px;
  }

  .two-cols{
    grid-template-columns:1fr;
  }

  .topbar{
    height:auto;
    min-height:62px;
    padding:10px 14px;
  }

  .topbar-title{
    font-size:15px;
  }

}
</style>

<body>

<div class="app">

<header class="topbar">

  <div class="topbar-title">
    Сервис генерации коммерческих предложений АЛЬФАПРОМ
  </div>

  <div class="toolbar">

    <button class="btn btn-primary" id="downloadPdfBtn">
      Скачать PDF
    </button>

    <button class="btn btn-primary" id="downloadDocxBtn">
      Скачать DOCX
    </button>

    <button class="btn btn-danger" id="resetBtn">
      Сбросить
    </button>

  </div>

</header>


<main class="layout">

<section class="editor" id="editor">

  <div id="productsEditor"></div>

  <button
    class="add-product-btn"
    id="addProductBtn"
  >
    ＋ Добавить оборудование
  </button>


  <div class="editor-section">

    <h2>Информация о менеджере</h2>

    <div class="two-cols">

      <div class="field">

        <label>Имя менеджера</label>

        <input
          type="text"
          id="managerName"
          placeholder="Имя менеджера"
        >

      </div>


      <div class="field">

        <label>Телефон</label>

        <input
          type="tel"
          id="managerPhone"
          placeholder="+7 (___) ___-__-__"
        >

      </div>

    </div>

  </div>

</section>


<section class="preview-side">

  <div class="preview-title">
    Предварительный просмотр
  </div>

  <div class="preview-scroll" id="previewScroll">

    <div
      class="preview-pages"
      id="previewPages"
    ></div>

  </div>

</section>

</main>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="https://unpkg.com/docx@9.5.1/build/index.umd.js"></script>


<script>

/* ============================================================
   CONSTANTS
============================================================ */

const STORAGE_KEY = "alfaprom_kp_editor_v5";

const OLD_KEYS = [
  "alfaprom_kp_editor_v4",
  "alfaprom_kp_editor_v3",
  "alfaprom_kp_editor_v2",
  "alfaprom_kp_editor_v1"
];

const DB_NAME = "alfaprom_kp_editor_images";

const DB_VERSION = 2;

const STORE_NAME = "photos";


const DEFAULT_ADVANTAGES = [

  "На рынке с 2017 г.",

  "Нам доверяют крупные федеральные заказчики",

  "Не продаем «железо», а решаем задачу под ключ",

  "ОСЗ (Оперативная Служба Заботы) - реагирование сервиса в течении 5 минут!",

  "ГЛЦ (Гарантия Лучшей Цены)"

];


let db = null;


/* ============================================================
   PRODUCT FACTORY
============================================================ */

function createProduct(){

  return {

    id:
      "product_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    productName:"",
    description:"",
    note:"",

    price:"",
    discountPrice:"",
    currency:"RUB",

    status:"available",

    priceComment:"",

    specsText:"",

    videoUrl:"",

    photoId:""

  };

}


/* ============================================================
   GLOBAL STATE
============================================================ */

const state = {

  products: [
    createProduct()
  ],

  managerName:"",

  managerPhone:"",

  advantages:DEFAULT_ADVANTAGES.slice()

};


/* ============================================================
   INDEXED DB
============================================================ */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded = function(e){

      const database =
        e.target.result;

      if(
        !database.objectStoreNames.contains(
          STORE_NAME
        )
      ){

        database.createObjectStore(
          STORE_NAME
        );

      }

    };


    request.onsuccess = function(){

      db = request.result;

      resolve(db);

    };


    request.onerror = function(){

      reject(request.error);

    };

  });

}


/*
  Подготавливаем фотографию перед сохранением.

  Что делаем:
  - создаём квадратный холст;
  - сохраняем пропорции исходного изображения;
  - вписываем изображение целиком без обрезки;
  - ограничиваем размер до 1600x1600;
  - сохраняем как JPEG с хорошим качеством.
*/

function preparePhoto(file){

  return new Promise((resolve,reject)=>{

    const url =
      URL.createObjectURL(
        file
      );

    const image =
      new Image();


    image.onload = ()=>{

      try{

        const sourceWidth =
          image.naturalWidth ||
          image.width;

        const sourceHeight =
          image.naturalHeight ||
          image.height;


        if(
          !sourceWidth ||
          !sourceHeight
        ){

          throw new Error(
            "Не удалось определить размер фотографии"
          );

        }


        const maxSize = 1600;


        const squareSize =
          Math.min(
            maxSize,
            Math.max(
              sourceWidth,
              sourceHeight
            )
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          squareSize;

        canvas.height =
          squareSize;


        const context =
          canvas.getContext(
            "2d"
          );


        if(!context){

          throw new Error(
            "Не удалось создать обработчик изображения"
          );

        }


        /*
          Белый фон нужен для того,
          чтобы прозрачные PNG/WebP
          корректно выглядели в PDF/DOCX
          и в квадратной рамке.
        */

        context.fillStyle =
          "#ffffff";

        context.fillRect(
          0,
          0,
          squareSize,
          squareSize
        );


        const scale =
          Math.min(
            squareSize / sourceWidth,
            squareSize / sourceHeight
          );


        const width =
          Math.round(
            sourceWidth * scale
          );


        const height =
          Math.round(
            sourceHeight * scale
          );


        const x =
          Math.round(
            (squareSize - width) / 2
          );


        const y =
          Math.round(
            (squareSize - height) / 2
          );


        context.drawImage(
          image,
          x,
          y,
          width,
          height
        );


        canvas.toBlob(
          blob=>{

            URL.revokeObjectURL(
              url
            );


            if(!blob){

              reject(
                new Error(
                  "Не удалось обработать фотографию"
                )
              );

              return;

            }


            resolve(
              blob
            );

          },
          "image/jpeg",
          0.88
        );

      }catch(error){

        URL.revokeObjectURL(
          url
        );

        reject(error);

      }

    };


    image.onerror = ()=>{

      URL.revokeObjectURL(
        url
      );

      reject(
        new Error(
          "Не удалось открыть изображение"
        )
      );

    };


    image.src = url;

  });

}


function savePhoto(blob){

  return new Promise(async (resolve,reject)=>{

    try{

      if(!db){

        await openDB();

      }


      if(!db){

        throw new Error(
          "Хранилище фотографий недоступно"
        );

      }


      const id =
        "photo_" +
        Date.now() +
        "_" +
        Math.random()
          .toString(36)
          .slice(2);


      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      transaction
        .objectStore(STORE_NAME)
        .put(blob,id);


      transaction.oncomplete = ()=>{

        resolve(id);

      };


      transaction.onerror = ()=>{

        reject(transaction.error);

      };


    }catch(error){

      reject(error);

    }

  });

}


function getPhoto(id){

  return new Promise(async (resolve,reject)=>{

    if(!id){

      resolve(null);

      return;

    }


    try{

      if(!db){

        await openDB();

      }


      if(!db){

        resolve(null);

        return;

      }


      const transaction =
        db.transaction(
          STORE_NAME,
          "readonly"
        );


      const request =
        transaction
          .objectStore(STORE_NAME)
          .get(id);


      request.onsuccess = ()=>{

        resolve(
          request.result || null
        );

      };


      request.onerror = ()=>{

        reject(request.error);

      };

    }catch(error){

      reject(error);

    }

  });

}


function deletePhoto(id){

  return new Promise(async (resolve,reject)=>{

    if(!id){

      resolve();

      return;

    }


    try{

      if(!db){

        await openDB();

      }


      if(!db){

        resolve();

        return;

      }


      const transaction =
        db.transaction(
          STORE_NAME,
          "readwrite"
        );


      transaction
        .objectStore(STORE_NAME)
        .delete(id);


      transaction.oncomplete =
        ()=>resolve();


      transaction.onerror =
        ()=>reject(transaction.error);

    }catch(error){

      reject(error);

    }

  });

}


/* ============================================================
   STATE LOAD / SAVE
============================================================ */

function loadState(){

  let saved = null;


  try{

    saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

  }catch(e){}


  if(!saved){

    for(const key of OLD_KEYS){

      try{

        const old =
          JSON.parse(
            localStorage.getItem(key)
          );


        if(old){

          saved = old;

          break;

        }

      }catch(e){}

    }

  }


  if(!saved){

    return;

  }


  if(Array.isArray(saved.products)){

    state.products =
      saved.products.map(product=>({

        ...createProduct(),

        ...product

      }));

  }


  else if(
    saved.productName !== undefined ||
    saved.description !== undefined ||
    saved.price !== undefined
  ){

    const product =
      createProduct();


    const productFields = [

      "productName",
      "description",
      "note",
      "price",
      "discountPrice",
      "currency",
      "status",
      "priceComment",
      "specsText",
      "videoUrl",
      "photoId"

    ];


    productFields.forEach(key=>{

      if(saved[key] !== undefined){

        product[key] =
          saved[key];

      }

    });


    state.products = [
      product
    ];

  }


  if(!state.products.length){

    state.products = [
      createProduct()
    ];

  }


  state.managerName =
    saved.managerName || "";


  state.managerPhone =
    saved.managerPhone || "";


  state.advantages =
    DEFAULT_ADVANTAGES.slice();

}


function saveState(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify({

      products:state.products,

      managerName:
        state.managerName,

      managerPhone:
        state.managerPhone,

      advantages:
        DEFAULT_ADVANTAGES.slice()

    })

  );

}


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");


}


function escapeAttribute(value){

  return escapeHtml(value);

}


function formatNumber(value){

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){

    return "";

  }


  const number =
    Number(value);


  if(Number.isNaN(number)){

    return escapeHtml(value);

  }


  return new Intl.NumberFormat(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  ).format(number);

}


function currencySymbol(currency){

  switch(currency){

    case "USD":
      return "$";

    case "EUR":
      return "€";

    default:
      return "₽";

  }

}


function formatPrice(
  value,
  currency
){

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){

    return "";

  }


  return (

    formatNumber(value) +

    " " +

    currencySymbol(currency)

  );

}


function safeFileName(name){

  let result =
    String(
      name ||
      "Коммерческое предложение"
    )

    .replace(
      /[<>:"/\\|?*\x00-\x1F]/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();


  if(!result){

    result =
      "Коммерческое предложение";

  }


  return (
    result +
    ", предложение от АЛЬФАПРОМ"
  );

}


function parseSpecs(text){

  const rows = [];


  String(text || "")

    .split(/\r?\n/)

    .map(
      line=>line.trim()
    )

    .filter(Boolean)

    .forEach(line=>{

      const colon =
        line.indexOf(":");


      if(colon > -1){

        const name =
          line
            .slice(0,colon)
            .trim();


        const value =
          line
            .slice(colon + 1)
            .trim();


        if(name || value){

          rows.push([
            name,
            value
          ]);

        }

      }else{

        rows.push([
          line,
          ""
        ]);

      }

    });


  return rows;

}

/* ============================================================
   BIND PRODUCT EVENTS
============================================================ */

function bindProductEditorEvents(){

  document
    .querySelectorAll(
      ".product-editor-card"
    )
    .forEach(card=>{

      const productId =
        card.dataset.productId;


      const product =
        state.products.find(
          p=>p.id === productId
        );


      if(!product){
        return;
      }


      card
        .querySelectorAll(
          "[data-field]"
        )
        .forEach(field=>{

          const eventName =
            field.tagName === "SELECT"
              ? "change"
              : "input";


          field.addEventListener(
            eventName,
            ()=>{

              product[
                field.dataset.field
              ] =
                field.value;


              saveState();

              renderPreview();

            }
          );

        });


      card
        .querySelectorAll(
          "[data-product-status]"
        )
        .forEach(button=>{

          button.addEventListener(
            "click",
            ()=>{

              product.status =
                button.dataset.status;


              saveState();

              renderProductsEditor();

              renderPreview();

            }
          );

        });


      const choose =
        card.querySelector(
          `[data-choose-photo="${productId}"]`
        );


      const input =
        card.querySelector(
          `[data-photo-input="${productId}"]`
        );


      const drop =
        card.querySelector(
          `[data-photo-drop="${productId}"]`
        );


      const remove =
        card.querySelector(
          `[data-remove-photo="${productId}"]`
        );


      choose.addEventListener(
        "click",
        e=>{

          e.preventDefault();

          e.stopPropagation();

          input.click();

        }
      );


      drop.addEventListener(
        "click",
        e=>{

          e.preventDefault();

          input.click();

        }
      );


      input.addEventListener(
        "change",
        async e=>{

          const file =
            e.target.files &&
            e.target.files[0];


          if(file){

            await handlePhoto(
              product,
              file
            );

          }


          input.value = "";

        }
      );


      drop.addEventListener(
        "dragover",
        e=>{

          e.preventDefault();

          e.stopPropagation();

          drop.classList.add(
            "dragover"
          );

        }
      );


      drop.addEventListener(
        "dragleave",
        e=>{

          e.preventDefault();

          drop.classList.remove(
            "dragover"
          );

        }
      );


      drop.addEventListener(
        "drop",
        async e=>{

          e.preventDefault();

          e.stopPropagation();

          drop.classList.remove(
            "dragover"
          );


          const file =
            e.dataTransfer.files &&
            e.dataTransfer.files[0];


          if(file){

            await handlePhoto(
              product,
              file
            );

          }

        }
      );


      remove.addEventListener(
        "click",
        async e=>{

          e.preventDefault();


          if(product.photoId){

            try{

              await deletePhoto(
                product.photoId
              );

            }catch(error){}

          }


          product.photoId = "";

          saveState();

          renderProductsEditor();

          renderPreview();

        }
      );


      const removeProduct =
        card.querySelector(
          `[data-remove-product="${productId}"]`
        );


      if(removeProduct){

        removeProduct.addEventListener(
          "click",
          async ()=>{

            if(
              !confirm(
                "Удалить это оборудование из КП?"
              )
            ){

              return;

            }


            if(product.photoId){

              try{

                await deletePhoto(
                  product.photoId
                );

              }catch(error){}

            }


            state.products =
              state.products.filter(
                p=>p.id !== productId
              );


            if(!state.products.length){

              state.products = [
                createProduct()
              ];

            }


            saveState();

            renderProductsEditor();

            renderPreview();

          }
        );

      }

    });

}


/* ============================================================
   PHOTO
============================================================ */

async function renderEditorPhoto(product){

  const drop =
    document.querySelector(
      `[data-photo-drop="${product.id}"]`
    );


  if(!drop){
    return;
  }


  if(!product.photoId){

    drop.classList.remove(
      "has-image"
    );


    drop.innerHTML = `

      <div class="photo-placeholder">

        Нажмите сюда или перетащите фотографию

        <br>

        <small>
          Фото автоматически подгоняется под квадрат без обрезки
        </small>

      </div>

    `;


    return;

  }


  try{

    const blob =
      await getPhoto(
        product.photoId
      );


    if(!blob){

      product.photoId = "";

      saveState();

      await renderEditorPhoto(
        product
      );

      return;

    }


    const url =
      URL.createObjectURL(
        blob
      );


    drop.classList.add(
      "has-image"
    );


    drop.innerHTML = `

      <img
        src="${url}"
        alt="Фото оборудования"
      >

    `;


    const image =
      drop.querySelector("img");


    image.onload = ()=>{

      URL.revokeObjectURL(url);

    };

  }catch(error){

    console.error(
      "Photo render error:",
      error
    );

  }

}


async function handlePhoto(
  product,
  file
){

  if(
    !file ||
    !file.type ||
    !file.type.startsWith("image/")
  ){

    alert(
      "Можно загружать только изображения."
    );

    return;

  }


  try{

    /*
      Сначала полностью подготавливаем
      и сохраняем новую фотографию.
      Старую удаляем только после успеха.
    */

    const preparedPhoto =
      await preparePhoto(
        file
      );


    const newPhotoId =
      await savePhoto(
        preparedPhoto
      );


    const oldPhotoId =
      product.photoId;


    product.photoId =
      newPhotoId;


    saveState();


    await renderEditorPhoto(
      product
    );


    renderPreview();


    /*
      Старое фото удаляем только после
      успешного сохранения новой версии.
    */

    if(oldPhotoId){

      try{

        await deletePhoto(
          oldPhotoId
        );

      }catch(error){

        console.warn(
          "Не удалось удалить старое фото:",
          error
        );

      }

    }

  }catch(error){

    console.error(
      "Photo save error:",
      error
    );


    alert(
      "Не удалось обработать и сохранить фотографию.\n\n" +
      (
        error.message ||
        "Попробуйте выбрать изображение ещё раз."
      )
    );

  }

}

async function getPhotoDataUrl(
  product
){

  if(!product.photoId){

    return "";

  }


  const blob =
    await getPhoto(
      product.photoId
    );


  if(!blob){

    return "";

  }


  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload = ()=>{
        resolve(
          reader.result
        );

      };


      reader.onerror = ()=>{
        reject(
          reader.error
        );

      };


      reader.readAsDataURL(
        blob
      );

    }
  );

}

/* ============================================================
   PREVIEW SCALE
============================================================ */

function getA4SizePx(){

  const temp =
    document.createElement(
      "div"
    );


  temp.style.width =
    "210mm";


  temp.style.height =
    "297mm";


  temp.style.position =
    "absolute";


  temp.style.visibility =
    "hidden";


  document.body.appendChild(
    temp
  );


  const width =
    temp.getBoundingClientRect().width;


  const height =
    temp.getBoundingClientRect().height;


  temp.remove();


  return {
    width,
    height
  };

}


function fitPreviewPages(){

  const scroll =
    document.getElementById(
      "previewScroll"
    );


  const shells =
    document.querySelectorAll(
      ".preview-page-shell"
    );


  if(!scroll || !shells.length){

    return;

  }


  const availableWidth =
    Math.max(
      100,
      scroll.clientWidth - 40
    );


  const availableHeight =
    Math.max(
      100,
      scroll.clientHeight - 40
    );


  const a4 =
    getA4SizePx();


  const scale =
    Math.min(

      availableWidth /
        a4.width,

      availableHeight /
        a4.height

    );


  shells.forEach(shell=>{

    shell.style.width =
      `${a4.width * scale}px`;


    shell.style.height =
      `${a4.height * scale}px`;


    const page =

async function downloadPDF(){

  const button =
    document.getElementById(
      "downloadPdfBtn"
    );


  button.disabled = true;

  button.textContent =
    "Формирование PDF...";


  try{

    const wrapper =
      document.createElement(
        "div"
      );


    wrapper.style.position =
      "fixed";

    wrapper.style.left =
      "-100000px";

    wrapper.style.top =
      "0";

    wrapper.style.width =
      "210mm";

    wrapper.style.background =
      "#fff";


    for(
      let index = 0;
      index < state.products.length;
      index++
    ){

      const product =
        state.products[index];


      const photoDataUrl =
        await getPhotoDataUrl(
          product
        );


      const pageWrapper =
        document.createElement(
          "div"
        );


      pageWrapper.innerHTML =
        createProductPageHtml(
          product,
          photoDataUrl,
          index
        );


      const page =
        pageWrapper.firstElementChild;


      page.style.pageBreakAfter =
        index <
        state.products.length - 1
          ? "always"
          : "auto";


      wrapper.appendChild(
        page
      );

    }


    document.body.appendChild(
      wrapper
    );


    const filename =
      safeFileName(
        state.products[0]?.productName
      ) +
      ".pdf";


    await html2pdf()

      .set({

        margin:0,

        filename:filename,

        image:{
          type:"jpeg",
          quality:0.98
        },

        html2canvas:{
          scale:2,
          useCORS:true,
          backgroundColor:"#ffffff"
        },

        jsPDF:{
          unit:"mm",
          format:"a4",
          orientation:"portrait"
        },

        pagebreak:{
          mode:[
            "css",
            "legacy"
          ]
        }

      })

      .from(wrapper)

      .save();


    wrapper.remove();

  }catch(error){

    console.error(error);


    alert(
      "Не удалось сформировать PDF.\n\n" +
      (
        error.message ||
        error
      )
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Скачать PDF";

  }

}


/* ============================================================
   DOCX HELPERS
============================================================ */

async function blobToUint8Array(blob){

  const buffer =
    await blob.arrayBuffer();


  return new Uint8Array(
    buffer
  );

}


function getImageDimensions(blob){

  return new Promise(
    (resolve,reject)=>{

      const url =
        URL.createObjectURL(
          blob
        );


      const image =
        new Image();


      image.onload = ()=>{

        const width =
          image.naturalWidth ||
          image.width;


        const height =
          image.naturalHeight ||
          image.height;


        URL.revokeObjectURL(
          url
        );


        resolve({
          width,
          height
        });

      };


      image.onerror = ()=>{

        URL.revokeObjectURL(
          url
        );


        reject(
          new Error(
            "Не удалось определить размер изображения"
          )
        );

      };


      image.src = url;

    }
  );

}


function calculateDocxImageSize(
  width,
  height
){

  const maxWidth =
    450;


  const maxHeight =
    320;


  const ratio =
    Math.min(
      maxWidth / width,
      maxHeight / height,
      1
    );


  return {

    width:
      Math.max(
        1,
        Math.round(
          width * ratio
        )
      ),

    height:
      Math.max(
        1,
        Math.round(
          height * ratio
        )
      )

  };

}

/* ============================================================
   DOCX
============================================================ */

async function createDocx(){

  const children = [];


  for(
    let index = 0;
    index < state.products.length;
    index++
  ){

    const product =
      state.products[index];


    if(index > 0){

      children.push(

        new docx.Paragraph({

          pageBreakBefore:true,

          children:[]

        })

      );

    }


    children.push(

      new docx.Paragraph({

        border:{

          bottom:{

            color:"FF8100",

            space:8,

            style:
              docx.BorderStyle
                .SINGLE,

            size:12

          }

        },

        spacing:{
          after:300
        },

        children:[

          new docx.TextRun({

            text:"АЛЬФАПРОМ",

            bold:true,

            color:"FF8100",

            size:32

          })

        ]

      })

    );


    children.push(

      new docx.Paragraph({

        spacing:{
          after:150
        },

        children:[

          new docx.TextRun({

            text:
              "Коммерческое предложение",

            bold:true,

            size:32

          })

        ]

      })

    );


    children.push(

      new docx.Paragraph({

        spacing:{
          after:250
        },

        children:[

          new docx.TextRun({

            text:
              product.productName ||
              `Оборудование №${index + 1}`,

            bold:true,

            size:28

          })

        ]

      })

    );


    const photoBlob =
      await getPhoto(
        product.photoId
      );


    if(photoBlob){

      try{

        const bytes =
          await blobToUint8Array(
            photoBlob
          );


        const dimensions =
          await getImageDimensions(
            photoBlob
          );


        const imageSize =
          calculateDocxImageSize(
            dimensions.width,
            dimensions.height
          );


        let imageType = "jpg";


        if(
          photoBlob.type ===
          "image/png"
        ){

          imageType = "png";

        }


        children.push(

          new docx.Paragraph({

            alignment:
              docx.AlignmentType
                .CENTER,

            spacing:{
              after:250
            },

            children:[

              new docx.ImageRun({

                data:bytes,

                transformation:{
                  width:imageSize.width,
                  height:imageSize.height
                },

                type:imageType

              })

            ]

          })

        );

      }catch(error){

        console.error(
          "DOCX image error:",
          error
        );

      }

    }


    if(
      product.description.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:150
          },

          children:[

            new docx.TextRun({

              text:
                product.description,

              size:21

            })

          ]

        })

      );

    }


    if(
      product.note.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:150
          },

          children:[

            new docx.TextRun({

              text:
                product.note,

              italics:true,

              color:"666666",

              size:19

            })

          ]

        })

      );

    }


    children.push(
      ...createDocxSpecs(
        product
      )
    );


    if(
      product.videoUrl.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            before:200,
            after:200
          },

          children:[

            new docx.ExternalHyperlink({

              link:
                product.videoUrl,

              children:[

                new docx.TextRun({

                  text:
                    "Смотреть видео оборудования",

                  bold:true,

                  color:"FF8100",

                  underline:{},

                  size:19

                })

              ]

            })

          ]

        })

      );

    }


    if(
      product.price ||
      product.discountPrice
    ){

      if(product.price){

        children.push(

          new docx.Paragraph({

            spacing:{
              before:150,
              after:80
            },

            children:[

              new docx.TextRun({

                text:
                  `Цена: ${formatPrice(
                    product.price,
                    product.currency
                  )}`,

                bold:true,

                size:26

              })

            ]

          })

        );

      }


      if(product.discountPrice){

        children.push(

          new docx.Paragraph({

            spacing:{
              after:100
            },

            children:[

              new docx.TextRun({

                text:
                  `Цена со скидкой: ${formatPrice(
                    product.discountPrice,
                    product.currency
                  )}`,

                bold:true,

                color:"D93025",

                size:26

              })

            ]

          })

        );

      }

    }


    children.push(

      new docx.Paragraph({

        spacing:{
          after:80
        },

        children:[

          new docx.TextRun({

            text:
              product.status === "order"
                ? "Под заказ"
                : "В наличии",

            bold:true,

            color:
              product.status === "order"
                ? "B96A00"
                : "168A45",

            size:21

          })

        ]

      })

    );


    if(
      product.priceComment.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:180
          },

          children:[

            new docx.TextRun({

              text:
                product.priceComment,

              color:"666666",

              size:18

            })

          ]

        })

      );

    }


    children.push(

      new docx.Paragraph({

        spacing:{
          before:300,
          after:180
        },

        children:[

          new docx.TextRun({

            text:
              "Почему мы?",

            bold:true,

            size:28

          })

        ]

      })

    );


    DEFAULT_ADVANTAGES.forEach(
      item=>{

        children.push(

          new docx.Paragraph({

            bullet:{
              level:0
            },

            spacing:{
              after:100
            },

            children:[

              new docx.TextRun({

                text:item,

                bold:true,

                size:22

              })

            ]

          })

        );

      }
    );

  }


  children.push(

    new docx.Paragraph({

      spacing:{
        before:300,
        after:100
      },

      children:[

        new docx.TextRun({

          text:
            "Контактное лицо",

          bold:true,

          size:21

        })

      ]

    })

  );


  if(
    state.managerName.trim()
  ){

    children.push(

      new docx.Paragraph({

        spacing:{
          after:50
        },

        children:[

          new docx.TextRun({

            text:
              state.managerName,

            bold:true,

            size:20

          })

        ]

      })

    );

  }


  if(
    state.managerPhone.trim()
  ){

    children.push(

      new docx.Paragraph({

        spacing:{
          after:250
        },

        children:[

          new docx.TextRun({

            text:
              state.managerPhone,

            size:20

          })

        ]

      })

    );

  }


  const footer =
    new docx.Footer({

      children:[

        new docx.Paragraph({

          border:{

            top:{

              color:"FF8100",

              space:4,

              style:
                docx.BorderStyle
                  .SINGLE,

              size:10

            }

          },

          spacing:{
            before:120
          },

          children:[

            new docx.TextRun({

              text:
                "АЛЬФАПРОМ  |  Оборудование для пищевого производства и упаковки  |  alfaprom.org",

              bold:true,

              color:"FF8100",

              size:17

            })

          ]

        })

      ]

    });


  const document =
    new docx.Document({

      sections:[{

        properties:{

          page:{

            margin:{

              top:800,

              right:900,

              bottom:900,

              left:900

            }

          }

        },

        headers:[],

        footers:[
          footer
        ],

        children:children

      }]

    });


  return docx.Packer.toBlob(
    document
  );

}


/* ============================================================
   DOWNLOAD DOCX
============================================================ */

async function downloadDOCX(){

  const button =
    document.getElementById(
      "downloadDocxBtn"
    );


  button.disabled = true;

  button.textContent =
    "Формирование DOCX...";


  try{

    const blob =
      await createDocx();


    const filename =
      safeFileName(
        state.products[0]?.productName
      ) +
      ".docx";


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href = url;

    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      1000
    );

  }catch(error){

    console.error(
      error
    );


    alert(
      "Не удалось сформировать DOCX.\n\n" +
      (
        error.message ||
        error
      )
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Скачать DOCX";

  }

}
