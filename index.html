<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>АЛЬФАПРОМ — редактор КП</title>

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
:root{
  --orange:#ff8100;
  --orange-dark:#e66f00;
  --red:#d92727;
  --green:#159447;
  --dark:#222;
  --muted:#777;
  --line:#ddd;
  --bg:#f2f3f5;
  --white:#fff;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--dark);
  background:var(--bg);
}

body{
  min-height:100vh;
}

/* =========================================================
   TOP APP BAR
========================================================= */

.topbar{
  position:sticky;
  top:0;
  z-index:1000;

  height:64px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 22px;

  background:#fff;

  border-bottom:4px solid var(--orange);

  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;

  color:var(--orange);

  font-size:20px;
  font-weight:800;
}

.brand-mark{
  width:34px;
  height:34px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:7px;

  background:var(--orange);
  color:#fff;

  font-size:21px;
  font-weight:900;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
}

.toolbar button{
  border:0;
  border-radius:7px;

  padding:9px 14px;

  cursor:pointer;

  font:inherit;
  font-size:13px;
  font-weight:700;
}

.btn-orange{
  background:var(--orange);
  color:#fff;
}

.btn-dark{
  background:#222;
  color:#fff;
}

.btn-light{
  background:#f2f2f2;
  color:#333;
}

.toolbar button:hover{
  opacity:.88;
}

/* =========================================================
   MAIN LAYOUT
========================================================= */

.layout{
  width:100%;
  min-height:calc(100vh - 64px);

  display:grid;
  grid-template-columns:50% 50%;
}

/* =========================================================
   EDITOR
========================================================= */

.editor-panel{
  min-width:0;

  padding:22px;

  background:#fff;

  border-right:1px solid var(--line);

  overflow-y:auto;
}

.editor-title{
  margin:0 0 20px;

  font-size:24px;
  line-height:1.2;
}

.section{
  margin-bottom:24px;
  padding-bottom:22px;

  border-bottom:1px solid #eee;
}

.section:last-child{
  border-bottom:0;
}

.section h2{
  margin:0 0 15px;

  font-size:18px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;

  margin-bottom:6px;

  font-size:13px;
  font-weight:700;

  color:#444;
}

input,
textarea,
select{
  width:100%;

  padding:10px 11px;

  border:1px solid #ccc;
  border-radius:7px;

  background:#fff;

  color:#222;

  font:inherit;

  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--orange);

  box-shadow:
    0 0 0 2px rgba(255,129,0,.12);
}

textarea{
  min-height:90px;
  resize:vertical;
}

.specs-textarea{
  min-height:175px;

  line-height:1.5;
}

.hint{
  margin-top:5px;

  color:#888;

  font-size:11px;
  line-height:1.4;
}

/* =========================================================
   EQUIPMENT EDITOR
========================================================= */

.equipment-editor{
  margin-bottom:16px;
  padding:16px;

  border:1px solid #ddd;
  border-radius:10px;

  background:#fafafa;
}

.equipment-editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:14px;
}

.equipment-editor-head strong{
  font-size:15px;
}

.remove-equipment{
  width:30px;
  height:30px;

  border:0;
  border-radius:6px;

  background:#eee;

  color:#777;

  cursor:pointer;

  font-weight:700;
}

.remove-equipment:hover{
  background:#ddd;
}

.add-equipment{
  width:100%;

  padding:11px;

  border:1px dashed var(--orange);
  border-radius:8px;

  background:#fff;

  color:var(--orange);

  cursor:pointer;

  font-weight:700;
}

.price-grid{
  display:grid;
  grid-template-columns:1fr 125px;
  gap:9px;
}

.status-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.status-option{
  padding:9px 7px;

  border:1px solid #ccc;
  border-radius:7px;

  background:#fff;

  cursor:pointer;

  font-size:13px;
  font-weight:700;
}

.status-option.active.stock{
  border-color:#9bd4b1;
  background:#edf9f1;
  color:var(--green);
}

.status-option.active.order{
  border-color:#f2c28e;
  background:#fff4e7;
  color:#bd6b00;
}

/* =========================================================
   PHOTO EDITOR
========================================================= */

.photo-drop{
  padding:17px;

  border:2px dashed #ccc;
  border-radius:9px;

  background:#fff;

  color:#777;

  text-align:center;

  cursor:pointer;

  transition:.15s;
}

.photo-drop:hover,
.photo-drop.dragover{
  border-color:var(--orange);

  background:#fffaf5;

  color:var(--orange);
}

.photo-input{
  display:none;
}

.photo-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;

  margin-top:10px;
}

.photo-item{
  position:relative;

  aspect-ratio:1/1;

  overflow:hidden;

  border-radius:7px;

  background:#eee;
}

.photo-item img{
  width:100%;
  height:100%;

  object-fit:cover;
}

.photo-delete{
  position:absolute;
  top:5px;
  right:5px;

  width:24px;
  height:24px;

  border:0;
  border-radius:50%;

  background:rgba(0,0,0,.65);

  color:#fff;

  cursor:pointer;

  font-size:14px;
}

/* =========================================================
   GENERAL SETTINGS
========================================================= */

.manager-section{
  margin-top:5px;
}

/* =========================================================
   PREVIEW AREA
========================================================= */

.preview-wrap{
  min-width:0;

  padding:22px;

  background:#dfe1e4;

  overflow:auto;
}

/*
  ВАЖНО:
  preview-stage масштабируется так,
  чтобы весь лист А4 помещался по ширине.
*/

.preview-stage{
  display:flex;
  justify-content:center;

  width:100%;
}

.preview-page{
  flex:none;

  width:210mm;
  min-height:297mm;

  background:#fff;

  box-shadow:0 2px 18px rgba(0,0,0,.15);

  overflow:hidden;
}

/* =========================================================
   КП HEADER
========================================================= */

.preview-header{
  position:relative;

  padding:20px 24px 15px;

  background:#fff;

  border-bottom:4px solid var(--orange);
}

.preview-header-main{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:20px;
}

.preview-logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.preview-logo-mark{
  width:44px;
  height:44px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:9px;

  background:var(--orange);

  color:#fff;

  font-size:27px;
  font-weight:900;
}

.preview-logo-name{
  color:var(--orange);

  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
}

.preview-contacts{
  color:#444;

  font-size:10px;
  line-height:1.45;

  text-align:right;
}

.preview-contacts strong{
  color:#222;

  font-size:11px;
}

.preview-header-links{
  display:flex;
  justify-content:flex-end;
  gap:15px;

  margin-top:10px;

  color:#666;

  font-size:9px;
}

/* =========================================================
   КП CONTENT
========================================================= */

.preview-content{
  padding:24px 30px 0;
}

.kp-title{
  margin:0 0 25px;

  font-size:28px;
  line-height:1.15;
}

/* =========================================================
   PRODUCT
========================================================= */

.product{
  margin-bottom:30px;

  page-break-inside:avoid;
  break-inside:avoid;
}

.product-name{
  margin:0 0 13px;

  font-size:21px;
  line-height:1.2;
}

/* =========================================================
   PRODUCT PHOTOS
   СРАЗУ ПОСЛЕ НАЗВАНИЯ
========================================================= */

.product-photos{
  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

  margin:0 0 17px;
}

.product-photo-frame{
  width:100%;

  aspect-ratio:1/1;

  overflow:hidden;

  border-radius:6px;

  background:#f1f1f1;
}

.product-photo-frame img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

/* =========================================================
   DESCRIPTION
========================================================= */

.product-description{
  margin-bottom:8px;

  font-size:12px;
  line-height:1.55;
}

.product-note{
  margin-bottom:14px;

  color:#666;

  font-size:11px;
  line-height:1.45;
}

/* =========================================================
   PRICE
========================================================= */

.price-block{
  margin:15px 0;
}

.price-normal{
  color:#111;

  font-size:18px;
  font-weight:800;

  line-height:1.35;
}

.price-discount{
  margin-top:3px;

  color:var(--red);

  font-size:21px;
  font-weight:900;

  line-height:1.35;
}

.price-status{
  margin-top:7px;

  font-size:12px;
  font-weight:800;
}

.price-status.stock{
  color:var(--green);
}

.price-status.order{
  color:#bd6b00;
}

.price-comment{
  margin-top:5px;

  color:#777;

  font-size:10px;
}

/* =========================================================
   SPECS
========================================================= */

.spec-table{
  width:100%;

  margin-top:12px;

  border-collapse:collapse;

  font-size:10px;
}

.spec-table th,
.spec-table td{
  padding:7px 8px;

  border:1px solid #ddd;

  vertical-align:top;
}

.spec-table th.spec-head{
  background:var(--orange);

  color:#fff;

  text-align:left;

  font-size:11px;
  font-weight:800;
}

.spec-table td:first-child{
  width:40%;

  background:#fafafa;

  font-weight:700;
}

/* =========================================================
   VIDEO
========================================================= */

.video-wrap{
  margin-top:15px;
}

.video-button{
  display:inline-block;

  padding:9px 14px;

  border-radius:6px;

  background:#222;

  color:#fff;

  text-decoration:none;

  font-size:10px;
  font-weight:700;
}

/* =========================================================
   ADVANTAGES
========================================================= */

.advantages-preview{
  margin:25px 0 0;

  padding:21px 0 23px;

  border-top:1px solid #eee;

  page-break-inside:avoid;
  break-inside:avoid;
}

.advantages-title{
  margin-bottom:18px;

  color:#222;

  font-size:17px;
  font-weight:800;

  text-align:center;
}

.advantages-grid{
  display:grid;

  grid-template-columns:repeat(6,1fr);

  column-gap:8px;
  row-gap:18px;
}

.advantage-card{
  grid-column:span 2;

  padding:3px 8px;

  color:#222;

  font-size:16px;
  line-height:1.25;

  font-weight:700;

  text-align:center;
}

.advantage-card:nth-child(4){
  grid-column:2 / span 2;
}

.advantage-card:nth-child(5){
  grid-column:4 / span 2;
}

.advantage-icon{
  width:27px;
  height:27px;

  display:flex;
  align-items:center;
  justify-content:center;

  margin:0 auto 8px;

  border-radius:50%;

  background:var(--orange);

  color:#fff;

  font-size:11px;
  font-weight:800;
}

/* =========================================================
   FOOTER
========================================================= */

.preview-footer{
  margin-top:0;

  padding:17px 30px 18px;

  background:var(--orange);

  color:#fff;

  page-break-inside:avoid;
  break-inside:avoid;
}

.footer-main{
  display:flex;

  align-items:flex-start;
  justify-content:space-between;

  gap:20px;
}

.footer-company{
  font-size:15px;
  font-weight:900;
}

.footer-text{
  max-width:440px;

  margin-top:5px;

  font-size:9px;
  line-height:1.45;
}

.footer-manager{
  text-align:right;

  font-size:10px;
  line-height:1.5;
}

.footer-manager strong{
  font-size:12px;
}

.footer-bottom{
  margin-top:10px;
  padding-top:8px;

  border-top:1px solid rgba(255,255,255,.4);

  font-size:8px;

  opacity:.9;
}

/* =========================================================
   EMPTY
========================================================= */

.empty{
  padding:20px;

  color:#888;

  font-size:12px;

  text-align:center;
}

/* =========================================================
   MOBILE EDITOR
========================================================= */

@media(max-width:1000px){

  .layout{
    grid-template-columns:1fr;
  }

  .editor-panel{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .preview-wrap{
    min-height:700px;
  }
}

@media(max-width:600px){

  .topbar{
    height:auto;
    min-height:60px;

    padding:9px 12px;

    gap:10px;
  }

  .brand{
    font-size:15px;
  }

  .toolbar{
    gap:4px;
  }

  .toolbar button{
    padding:8px 8px;

    font-size:10px;
  }

  .editor-panel{
    padding:14px;
  }

  .price-grid{
    grid-template-columns:1fr;
  }

  .photo-list{
    grid-template-columns:repeat(3,1fr);
  }
}

/* =========================================================
   PRINT SUPPORT FOR PDF LIBRARY
========================================================= */

.pdf-export-mode{
  box-shadow:none !important;
}

.pdf-export-mode .preview-page{
  box-shadow:none !important;
}
</style>

<script>

/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY =
  'alfaprom_kp_editor_v3';

const OLD_STORAGE_KEYS = [
  'alfaprom_kp_editor_v2',
  'alfaprom_kp_editor_v1'
];

const DB_NAME =
  'alfaprom_kp_editor_images';

const DB_VERSION = 1;

const PHOTO_STORE =
  'photos';

let state = null;

let db = null;

const objectUrlCache =
  new Map();


/* =========================================================
   DEFAULT STATE
========================================================= */

function getDefaultState(){

  return {

    kpTitle:
      'Коммерческое предложение',

    managerName:
      '',

    managerPhone:
      '',

    globalVideo:
      '',

    /*
      Преимущества фиксированы.
      В редакторе их больше нет.
    */

    advantages: [

      'На рынке с 2017 г.',

      'Нам доверяют крупные федеральные заказчики',

      'Не продаем «железо», а решаем задачу под ключ',

      'ОСЗ (Оперативная Служба Заботы) - реагирование сервиса в течении 5 минут!',

      'ГЛЦ (Гарантия Лучшей Цены)'

    ],

    equipment: [

      {

        name:
          'Пельменный аппарат Foodatlas JGL120-5B',

        description:
          'Профессиональный автоматический аппарат для производства пельменей.',

        note:
          '',

        price:
          '200890',

        discountPrice:
          '',

        currency:
          'RUB',

        availability:
          'stock',

        priceComment:
          '',

        specsText:
`Производительность: до 120 кг/ч
Вес: 160 кг
Габариты: 990 × 470 × 1150 мм
Мощность: 1,5 кВт`,

        photos:
          []

      }

    ]

  };

}


/* =========================================================
   INDEXED DB
========================================================= */

function openImageDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );

    request.onupgradeneeded =
      function(event){

        const database =
          event.target.result;

        if(
          !database.objectStoreNames.contains(
            PHOTO_STORE
          )
        ){

          database.createObjectStore(
            PHOTO_STORE,
            {
              keyPath:'id'
            }
          );

        }

      };

    request.onsuccess =
      function(event){

        db =
          event.target.result;

        resolve(db);

      };

    request.onerror =
      function(){

        reject(request.error);

      };

  });

}


function photoPut(id,blob){

  if(!db){
    return Promise.resolve();
  }

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(
        PHOTO_STORE,
        'readwrite'
      );

    const store =
      transaction.objectStore(
        PHOTO_STORE
      );

    store.put({
      id:id,
      blob:blob
    });

    transaction.oncomplete =
      ()=>resolve();

    transaction.onerror =
      ()=>reject(transaction.error);

  });

}


function photoGet(id){

  if(!db){
    return Promise.resolve(null);
  }

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(
        PHOTO_STORE,
        'readonly'
      );

    const store =
      transaction.objectStore(
        PHOTO_STORE
      );

    const request =
      store.get(id);

    request.onsuccess =
      ()=>{
        resolve(
          request.result || null
        );
      };

    request.onerror =
      ()=>{
        reject(request.error);
      };

  });

}


function photoDelete(id){

  if(!db){
    return Promise.resolve();
  }

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(
        PHOTO_STORE,
        'readwrite'
      );

    const store =
      transaction.objectStore(
        PHOTO_STORE
      );

    store.delete(id);

    transaction.oncomplete =
      ()=>resolve();

    transaction.onerror =
      ()=>reject(transaction.error);

  });

}


function photoClear(){

  if(!db){
    return Promise.resolve();
  }

  return new Promise((resolve,reject)=>{

    const transaction =
      db.transaction(
        PHOTO_STORE,
        'readwrite'
      );

    const store =
      transaction.objectStore(
        PHOTO_STORE
      );

    store.clear();

    transaction.oncomplete =
      ()=>resolve();

    transaction.onerror =
      ()=>reject(transaction.error);

  });

}


/* =========================================================
   PHOTO IDS
========================================================= */

function createPhotoId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return (
    'photo_' +
    Date.now() +
    '_' +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


/* =========================================================
   IMAGE HELPERS
========================================================= */

function dataURLToBlob(dataURL){

  const parts =
    dataURL.split(',');

  const match =
    parts[0].match(
      /:(.*?);/
    );

  const mime =
    match
      ? match[1]
      : 'image/jpeg';

  const binary =
    atob(parts[1]);

  const bytes =
    new Uint8Array(
      binary.length
    );

  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);

  }

  return new Blob(
    [bytes],
    {
      type:mime
    }
  );

}


async function getPhotoURL(id){

  if(!id){
    return '';
  }

  if(
    objectUrlCache.has(id)
  ){

    return objectUrlCache.get(id);

  }

  const item =
    await photoGet(id);

  if(!item){
    return '';
  }

  const url =
    URL.createObjectURL(
      item.blob
    );

  objectUrlCache.set(
    id,
    url
  );

  return url;

}


function revokeAllObjectURLs(){

  for(
    const url of objectUrlCache.values()
  ){

    URL.revokeObjectURL(
      url
    );

  }

  objectUrlCache.clear();

}


/* =========================================================
   STATE
========================================================= */

function saveState(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );

}


function loadState(){

  let saved =
    localStorage.getItem(
      STORAGE_KEY
    );

  /*
    Если новая версия ещё не существует,
    пробуем старые версии.
  */

  if(!saved){

    for(
      const key of OLD_STORAGE_KEYS
    ){

      const old =
        localStorage.getItem(key);

      if(old){

        saved = old;

        break;

      }

    }

  }


  if(!saved){

    state =
      getDefaultState();

    return;

  }


  try{

    state =
      JSON.parse(saved);

  }catch{

    state =
      getDefaultState();

  }

  normalizeState();

}


function normalizeState(){

  if(
    !state ||
    typeof state !== 'object'
  ){

    state =
      getDefaultState();

    return;

  }


  if(
    !Array.isArray(
      state.equipment
    )
  ){

    state.equipment = [];

  }


  /*
    Преимущества теперь всегда берутся
    из шаблона и не редактируются.
  */

  state.advantages =
    getDefaultState().advantages;


  if(
    state.kpTitle === undefined
  ){
    state.kpTitle = '';
  }

  if(
    state.managerName === undefined
  ){
    state.managerName = '';
  }

  if(
    state.managerPhone === undefined
  ){
    state.managerPhone = '';
  }

  if(
    state.globalVideo === undefined
  ){
    state.globalVideo = '';
  }

  if(
    state.footerText === undefined
  ){
    state.footerText = '';
  }


  state.equipment.forEach(
    equipment=>{

      if(
        !Array.isArray(
          equipment.photos
        )
      ){

        equipment.photos = [];

      }


      if(
        equipment.discountPrice === undefined
      ){

        equipment.discountPrice = '';

      }


      if(
        equipment.currency === undefined
      ){

        equipment.currency = 'RUB';

      }


      if(
        equipment.availability === undefined
      ){

        equipment.availability = 'stock';

      }


      if(
        equipment.priceComment === undefined
      ){

        equipment.priceComment = '';

      }


      if(
        equipment.specsText === undefined
      ){

        if(
          Array.isArray(
            equipment.specs
          )
        ){

          equipment.specsText =
            equipment.specs
              .map(spec=>{

                if(
                  typeof spec === 'string'
                ){

                  return spec;

                }

                if(
                  spec &&
                  spec.name
                ){

                  return (
                    spec.name +
                    ': ' +
                    (spec.value || '')
                  );

                }

                return '';

              })
              .filter(Boolean)
              .join('\n');

        }else{

          equipment.specsText = '';

        }

      }

    }
  );

}


/* =========================================================
   MIGRATE OLD BASE64 PHOTOS
========================================================= */

async function migrateOldPhotos(){

  let changed =
    false;


  for(
    const equipment of state.equipment || []
  ){

    if(
      !Array.isArray(
        equipment.photos
      )
    ){

      continue;

    }


    const newPhotos = [];


    for(
      const photo of equipment.photos
    ){

      /*
        Старый формат:
        Base64 внутри localStorage.
      */

      if(
        typeof photo === 'string' &&
        photo.startsWith('data:')
      ){

        const id =
          createPhotoId();

        const blob =
          dataURLToBlob(photo);

        await photoPut(
          id,
          blob
        );

        newPhotos.push(id);

        changed = true;

      }else{

        newPhotos.push(photo);

      }

    }


    equipment.photos =
      newPhotos;

  }


  if(changed){

    saveState();

  }

}


/* =========================================================
   FORMATTERS
========================================================= */

function currencySymbol(currency){

  if(currency === 'USD'){
    return '$';
  }

  if(currency === 'EUR'){
    return '€';
  }

  return '₽';

}


function formatPrice(value){

  if(
    value === undefined ||
    value === null
  ){

    return '';

  }

  const clean =
    String(value)
      .replace(/\s/g,'')
      .replace(',','.');


  const number =
    Number(clean);


  if(
    !Number.isFinite(number)
  ){

    return String(value);

  }


  return new Intl.NumberFormat(
    'ru-RU',
    {
      maximumFractionDigits:2
    }
  ).format(number);

}


/* =========================================================
   SPECS PARSER
========================================================= */

function parseSpecs(text){

  if(!text){
    return [];
  }


  return text
    .split(/\r?\n/)
    .map(
      line=>line.trim()
    )
    .filter(Boolean)
    .map(
      line=>{

        let match =
          line.match(
            /^(.+?)\s*:\s*(.+)$/
          );


        if(!match){

          match =
            line.match(
              /^(.+?)\s+[—-]\s+(.+)$/
            );

        }


        if(!match){

          match =
            line.match(
              /^(.+?)\t+(.+)$/
            );

        }


        if(match){

          return {

            name:
              match[1].trim(),

            value:
              match[2].trim()

          };

        }


        return {

          name:'',

          value:line

        };

      }
    );

}

/* =========================================================
   REMOVE EQUIPMENT
========================================================= */

async function removeEquipment(
  index
){

  const equipment =
    state.equipment[index];

  if(!equipment){
    return;
  }


  for(
    const id of equipment.photos || []
  ){

    if(
      typeof id === 'string' &&
      !id.startsWith('data:')
    ){

      try{

        await photoDelete(id);

      }catch{}

    }

  }


  state.equipment.splice(
    index,
    1
  );


  saveState();

  renderEditor();

  renderPreview();

}


/* =========================================================
   PHOTO INPUT
========================================================= */

function handleDragOver(event){

  event.preventDefault();

  event.currentTarget
    .classList
    .add('dragover');

}


function handleDragLeave(event){

  event.currentTarget
    .classList
    .remove('dragover');

}


function handlePhotoDrop(
  event,
  index
){

  event.preventDefault();

  event.currentTarget
    .classList
    .remove('dragover');


  const files =
    [...event.dataTransfer.files]
      .filter(
        file=>
          file.type.startsWith('image/')
      );


  addPhotos(
    files,
    index
  );

}


function handlePhotoInput(
  event,
  index
){

  const files =
    [...event.target.files];


  addPhotos(
    files,
    index
  );


  event.target.value =
    '';

}


async function addPhotos(
  files,
  index
){

  if(
    !state.equipment[index]
  ){
    return;
  }


  for(
    const file of files
  ){

    if(
      !file.type.startsWith('image/')
    ){
      continue;
    }


    const id =
      createPhotoId();


    await photoPut(
      id,
      file
    );


    state.equipment[index]
      .photos
      .push(id);

  }


  saveState();

  renderEquipmentEditor();

  renderPreview();

}


/* =========================================================
   DELETE PHOTO
========================================================= */

async function deletePhoto(
  equipmentIndex,
  photoIndex
){

  const equipment =
    state.equipment[
      equipmentIndex
    ];


  if(!equipment){
    return;
  }


  const id =
    equipment.photos[
      photoIndex
    ];


  if(id){

    try{

      await photoDelete(id);

    }catch{}

  }


  if(
    objectUrlCache.has(id)
  ){

    URL.revokeObjectURL(
      objectUrlCache.get(id)
    );

    objectUrlCache.delete(id);

  }


  equipment.photos.splice(
    photoIndex,
    1
  );


  saveState();

  renderEquipmentEditor();

  renderPreview();

}


/* =========================================================
   PHOTO LIST
========================================================= */

async function renderPhotoList(
  index
){

  const container =
    document.getElementById(
      `photoList_${index}`
    );


  if(!container){
    return;
  }


  container.innerHTML =
    '';


  const photos =
    state.equipment[index]
      ?.photos || [];


  for(
    let photoIndex=0;
    photoIndex<photos.length;
    photoIndex++
  ){

    const id =
      photos[photoIndex];


    const url =
      await getPhotoURL(id);


    if(!url){
      continue;
    }


    const item =
      document.createElement(
        'div'
      );


    item.className =
      'photo-item';


    item.innerHTML = `

      <img
        src="${url}"
        alt=""
      >

      <button
        class="photo-delete"
        type="button"
        onclick="deletePhoto(${index},${photoIndex})"
      >
        ×
      </button>

    `;


    container.appendChild(
      item
    );

  }

}

/* =========================================================
   FIT WHOLE A4 PAGE
========================================================= */

function fitPreviewToScreen(){

  const wrap =
    document.querySelector(
      '.preview-wrap'
    );

  const page =
    document.querySelector(
      '.preview-page'
    );


  if(
    !wrap ||
    !page
  ){
    return;
  }


  /*
    Реальный размер страницы:
    210mm ≈ 793.7px при 96 DPI.
  */

  const pageWidth =
    page.offsetWidth;


  const availableWidth =
    wrap.clientWidth - 30;


  let scale =
    availableWidth /
    pageWidth;


  /*
    Не увеличиваем страницу
    больше 100%.
  */

  scale =
    Math.min(
      scale,
      1
    );


  /*
    Для очень маленьких экранов
    всё равно оставляем возможность
    прокрутки.
  */

  if(scale < .55){
    scale = .55;
  }


  page.style.transform =
    `scale(${scale})`;

  page.style.transformOrigin =
    'top center';


  /*
    Компенсируем визуальную высоту
    масштабированной страницы.
  */

  const realHeight =
    page.offsetHeight;

  const visualHeight =
    realHeight * scale;


  page.parentElement.style.height =
    visualHeight + 'px';

}


window.addEventListener(
  'resize',
  fitPreviewToScreen
);


/* =========================================================
   PDF EXPORT
========================================================= */

async function downloadPDF(){

  if(
    typeof html2pdf ===
    'undefined'
  ){

    alert(
      'Не загрузился модуль PDF. Проверьте интернет-соединение и попробуйте ещё раз.'
    );

    return;

  }


  const page =
    document.getElementById(
      'preview'
    );


  if(!page){
    return;
  }


  /*
    Клонируем страницу,
    чтобы экспорт не менял
    отображение редактора.
  */

  const clone =
    page.cloneNode(true);


  clone.classList.add(
    'pdf-export-mode'
  );


  clone.style.transform =
    'none';

  clone.style.margin =
    '0';

  clone.style.boxShadow =
    'none';


  /*
    Фиксируем размер А4.
  */

  clone.style.width =
    '210mm';

  clone.style.minHeight =
    '297mm';


  const container =
    document.createElement(
      'div'
    );


  container.style.position =
    'fixed';

  container.style.left =
    '-100000px';

  container.style.top =
    '0';

  container.style.width =
    '210mm';

  container.style.background =
    '#fff';

  container.appendChild(
    clone
  );

  document.body.appendChild(
    container
  );


  /*
    Ждём изображения.
  */

  await waitForImages(
    clone
  );


  const filename =
    safeFilename(
      state.kpTitle ||
      'Коммерческое предложение'
    );


  const options = {

    margin:0,

    filename:
      filename + '.pdf',

    image:{
      type:'jpeg',
      quality:.98
    },

    html2canvas:{
      scale:2,
      useCORS:true,
      backgroundColor:'#ffffff',

      logging:false
    },

    jsPDF:{
      unit:'mm',
      format:'a4',
      orientation:'portrait'
    },

    pagebreak:{
      mode:[
        'css',
        'legacy'
      ]
    }

  };


  try{

    await html2pdf()
      .set(options)
      .from(clone)
      .save();

  }catch(error){

    console.error(
      'PDF export error:',
      error
    );

    alert(
      'Не удалось сформировать PDF.'
    );

  }finally{

    container.remove();

  }

}


/* =========================================================
   DOCX EXPORT
========================================================= */

async function downloadDOCX(){

  if(
    typeof htmlDocx ===
    'undefined'
  ){

    alert(
      'Не загрузился модуль DOCX. Проверьте интернет-соединение и попробуйте ещё раз.'
    );

    return;

  }


  const page =
    document.getElementById(
      'preview'
    );


  if(!page){
    return;
  }


  /*
    Клонируем предпросмотр.
  */

  const clone =
    page.cloneNode(true);


  clone.style.transform =
    'none';

  clone.style.boxShadow =
    'none';


  /*
    DOCX не умеет использовать
    blob:-ссылки на изображения.
    Поэтому заменяем их на Base64.
  */

  const images =
    [
      ...clone.querySelectorAll(
        'img'
      )
    ];


  for(
    const image of images
  ){

    const src =
      image.getAttribute(
        'src'
      );


    if(
      !src ||
      !src.startsWith('blob:')
    ){

      continue;

    }


    const id =
      findPhotoIdByObjectURL(
        src
      );


    if(!id){
      continue;
    }


    const item =
      await photoGet(id);


    if(!item){
      continue;
    }


    const dataURL =
      await blobToDataURL(
        item.blob
      );


    image.setAttribute(
      'src',
      dataURL
    );

  }


  /*
    html-docx-js получает
    полноценный HTML и преобразует
    его в настоящий DOCX.
  */

  const css =
    getExportCSS();


  const html = `

<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<style>

${css}

</style>

</head>

<body>

${clone.outerHTML}

</body>

</html>

  `;


  try{

    const blob =
      htmlDocx.asBlob(
        html
      );


    const filename =
      safeFilename(
        state.kpTitle ||
        'Коммерческое предложение'
      );


    downloadBlob(
      blob,
      filename + '.docx'
    );

  }catch(error){

    console.error(
      'DOCX export error:',
      error
    );

    alert(
      'Не удалось сформировать DOCX.'
    );

  }

}

/* =========================================================
   EXPORT HELPERS
========================================================= */

function findPhotoIdByObjectURL(
  url
){

  for(
    const [
      id,
      cachedURL
    ] of objectUrlCache.entries()
  ){

    if(
      cachedURL === url
    ){

      return id;

    }

  }

  return null;

}


function blobToDataURL(
  blob
){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onloadend =
        ()=>{
          resolve(
            reader.result
          );
        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }
  );

}


function downloadBlob(
  blob,
  filename
){

  const url =
    URL.createObjectURL(
      blob
    );


  const link =
    document.createElement(
      'a'
    );


  link.href =
    url;

  link.download =
    filename;


  document.body.appendChild(
    link
  );


  link.click();

  link.remove();


  setTimeout(
    ()=>{
      URL.revokeObjectURL(
        url
      );
    },
    1500
  );

}


function waitForImages(
  container
){

  const images =
    [
      ...container.querySelectorAll(
        'img'
      )
    ];


  return Promise.all(
    images.map(
      image=>
        new Promise(
          resolve=>{

            if(
              image.complete
            ){

              resolve();

              return;

            }


            image.onload =
              resolve;

            image.onerror =
              resolve;

          }
        )
    )
  );

}

/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(
  value
){

  return String(
    value ?? ''
  )
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


function escapeAttribute(
  value
){

  return escapeHTML(
    value
  );

}


function nl2br(
  value
){

  return String(
    value || ''
  )
  .replace(
    /\n/g,
    '<br>'
  );

}


function safeFilename(
  value
){

  return String(
    value ||
    'Коммерческое предложение'
  )
  .replace(
    /[<>:"/\\|?*]+/g,
    ' '
  )
  .replace(
    /\s+/g,
    ' '
  )
  .trim()
  .slice(
    0,
    100
  );

}
