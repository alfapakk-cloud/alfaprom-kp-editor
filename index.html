<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сервис генерации коммерческих предложений АЛЬФАПРОМ</title>

<style>
:root{
  --orange:#ff8100;
  --text:#202124;
  --muted:#6b7280;
  --border:#d9dce1;
  --bg:#f4f5f7;
  --green:#168a45;
  --red:#d93025;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ============================================================
   TOP
============================================================ */

.topbar{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:0 18px;
  background:#fff;
  border-bottom:2px solid var(--orange);
}

.topbar-title{
  font-size:18px;
  font-weight:700;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px 14px;
  font-weight:600;
  transition:.15s;
}

.btn:hover{
  border-color:var(--orange);
}

.btn-primary{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}

.btn-primary:hover{
  background:var(--orange);
}

.btn-danger{
  color:#b42318;
}

/* ============================================================
   MAIN
============================================================ */

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:50% 50%;
}

/* ============================================================
   EDITOR
============================================================ */

.editor{
  min-width:0;
  overflow:auto;
  padding:20px;
  background:#f7f8fa;
  border-right:1px solid #ddd;
}

.editor-section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
}

.editor-section h2{
  margin:0 0 16px;
  font-size:18px;
}

.editor-section h3{
  margin:0 0 14px;
  font-size:16px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:#40444a;
}

input[type="text"],
input[type="tel"],
input[type="number"],
input[type="url"],
textarea,
select{
  width:100%;
  border:1px solid #cfd3d8;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--orange);
}

textarea{
  min-height:90px;
  resize:vertical;
  line-height:1.45;
}

.specs-textarea{
  min-height:170px;
}

.two-cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.status-buttons{
  display:flex;
  gap:8px;
}

.status-button{
  flex:1;
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px;
  font-weight:600;
}

.status-button.active{
  border-color:var(--orange);
  box-shadow:0 0 0 1px var(--orange) inset;
}

.status-button[data-status="available"].active{
  color:var(--green);
}

.status-button[data-status="order"].active{
  color:#b96a00;
}

/* ============================================================
   PRODUCT CARD IN EDITOR
============================================================ */

.product-editor-card{
  background:#fff;
  border:1px solid #d7dbe0;
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
  box-shadow:0 2px 7px rgba(0,0,0,.035);
}

.product-editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:16px;
}

.product-editor-title{
  font-size:18px;
  font-weight:800;
}

.product-number{
  color:var(--orange);
}

.remove-product-btn{
  border:1px solid #e0c9c6;
  background:#fff;
  color:#b42318;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
  font-weight:700;
}

.remove-product-btn:hover{
  border-color:#b42318;
}

.add-product-btn{
  width:100%;
  border:1px dashed var(--orange);
  background:#fff8f0;
  color:#c86400;
  border-radius:9px;
  padding:12px;
  font-weight:700;
  margin-bottom:16px;
}

.add-product-btn:hover{
  background:#fff2e4;
}

/* ============================================================
   PHOTO EDITOR
============================================================ */

.photo-editor{
  margin-bottom:14px;
}

.photo-editor-grid{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  gap:12px;
}

.photo-editor-item{
  flex:0 0 auto;
  min-width:0;
}

.photo-drop{
  width:260px;
  height:260px;
  border:2px dashed #cfd3d8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fafafa;
  overflow:hidden;
  position:relative;
  transition:border-color .15s,background .15s;
  cursor:pointer;
}

.photo-drop:hover,
.photo-drop.dragover{
  border-color:var(--orange);
  background:#fffaf5;
}

.photo-drop.has-image{
  border-style:solid;
  border-color:#d7d9dc;
  background:#fff;
}

.photo-drop img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  padding:8px;
}

.photo-placeholder{
  color:#73777d;
  font-size:13px;
  line-height:1.5;
  padding:20px;
}

.photo-item-remove{
  margin-top:6px;
  width:100%;
  border:1px solid #e0c9c6;
  background:#fff;
  color:#b42318;
  border-radius:7px;
  padding:6px 8px;
  font-size:12px;
}

.photo-item-remove:hover{
  border-color:#b42318;
}

.photo-size-label{
  margin-top:5px;
  text-align:center;
  font-size:11px;
  color:#777;
}

.photo-resize-handle{
  position:absolute;
  right:5px;
  bottom:5px;
  width:24px;
  height:24px;
  border-radius:6px;
  background:rgba(255,129,0,.96);
  border:2px solid #fff;
  box-shadow:0 1px 5px rgba(0,0,0,.28);
  cursor:nwse-resize;
  z-index:5;
}

.photo-resize-handle::after{
  content:"";
  position:absolute;
  right:4px;
  bottom:4px;
  width:7px;
  height:7px;
  border-right:2px solid #fff;
  border-bottom:2px solid #fff;
}

.photo-actions{
  margin-top:8px;
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
}

.small-btn:hover{
  border-color:var(--orange);
}

.file-input{
  display:none;
}

/* ============================================================
   PREVIEW
============================================================ */

.preview-side{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#e8eaed;
}

.preview-title{
  flex:none;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
  border-bottom:1px solid #d7d9dc;
  font-size:16px;
  font-weight:700;
}

.preview-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:20px;
}

.preview-pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
}

.preview-page-shell{
  position:relative;
  flex:none;
}

.preview-page-scaled{
  position:absolute;
  left:0;
  top:0;
  transform-origin:top left;
}

/* ============================================================
   A4
============================================================ */

.kp-page{
  width:210mm;
  height:297mm;
  background:#fff;
  position:relative;
  box-shadow:0 3px 15px rgba(0,0,0,.14);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  flex:none;
}

.kp-content{
  flex:1;
  min-height:0;
  padding:10mm 15mm 9mm;
  overflow:hidden;
}

.kp-header{
  height:24mm;
  display:flex;
  align-items:center;
  border-bottom:2px solid var(--orange);
  margin-bottom:4mm;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:34px;
  height:34px;
  background:var(--orange);
  color:#fff;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:800;
}

.brand-name{
  color:var(--orange);
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.kp-title{
  font-size:22px;
  font-weight:800;
  margin-bottom:3mm;
}

.kp-product-name{
  font-size:19px;
  font-weight:750;
  line-height:1.2;
  margin-bottom:3mm;
}

/* ============================================================
   PHOTO PREVIEW
============================================================ */

.product-photo-grid{
  width:100%;
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  gap:4mm;
  margin-bottom:4mm;
}

.product-photo-frame{
  flex:0 0 auto;
  border:1px solid #e0e2e5;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
}

.product-photo-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  padding:2.5mm;
}

/* ============================================================
   DESCRIPTION
============================================================ */

.kp-description{
  font-size:12.5px;
  line-height:1.5;
  white-space:pre-wrap;
  margin-bottom:3mm;
}

.kp-note{
  font-size:11.5px;
  color:#666;
  line-height:1.4;
  white-space:pre-wrap;
  margin-bottom:3mm;
}

/* ============================================================
   SPECS
============================================================ */

.specs-table{
  width:100%;
  border-collapse:collapse;
  font-size:10.5px;
  margin:2mm 0 3mm;
}

.specs-table th,
.specs-table td{
  border:1px solid #d9dce0;
  padding:5px 7px;
  text-align:left;
  vertical-align:top;
}

.specs-table th{
  background:var(--orange);
  color:#fff;
  font-weight:800;
}

.specs-table td:first-child{
  width:40%;
  font-weight:650;
}

/* ============================================================
   VIDEO
============================================================ */

.video-button{
  display:inline-block;
  margin:1mm 0 3mm;
  padding:8px 12px;
  border-radius:6px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
}

/* ============================================================
   PRICE
============================================================ */

.price-block{
  margin:2mm 0 3mm;
}

.price-line{
  font-size:17px;
  font-weight:800;
  margin-bottom:1.5mm;
}

.price-line.discount{
  color:var(--red);
}

.availability{
  font-size:13px;
  font-weight:800;
  margin-bottom:2mm;
}

.availability.available{
  color:var(--green);
}

.availability.order{
  color:#b96a00;
}

.price-comment{
  font-size:11px;
  color:#666;
  line-height:1.4;
  margin-bottom:3mm;
}

/* ============================================================
   WHY US
============================================================ */

.advantages{
  margin-top:auto;
  padding-top:4mm;
}

.advantages-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
  margin-bottom:4mm;
}

.advantages-title::before{
  content:"";
  display:block;
  width:5px;
  height:21px;
  border-radius:3px;
  background:var(--orange);
}

.advantages-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:3.5mm;
}

.advantage{
  grid-column:span 2;
  min-height:25mm;
  border:1px solid #e0e3e7;
  border-radius:9px;
  padding:4mm 3.5mm;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:16px;
  font-weight:700;
  line-height:1.25;
  background:linear-gradient(180deg,#fff 0%,#fafafa 100%);
  box-shadow:0 2px 7px rgba(0,0,0,.045);
  position:relative;
}

.advantage::before{
  content:"✓";
  position:absolute;
  top:5px;
  left:6px;
  width:19px;
  height:19px;
  border:1px solid var(--orange);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--orange);
  font-size:12px;
  font-weight:800;
}

.advantage:nth-child(4){
  grid-column:2 / span 2;
}

.advantage:nth-child(5){
  grid-column:4 / span 2;
}

/* ============================================================
   FOOTER
============================================================ */

.kp-footer{
  flex:none;
  height:25mm;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10mm;
  padding:5mm 15mm;
}

.footer-left{
  font-size:12px;
  font-weight:700;
  line-height:1.4;
}

.footer-right{
  text-align:right;
  font-size:12px;

}

.footer-manager{
  font-weight:800;

/* ============================================================
   RESPONSIVE
============================================================ */

@media(max-width:900px){

  .layout{
    grid-template-columns:1fr;
  }

  .editor{
    border-right:0;
  }

  }

  .two-cols{
    grid-template-columns:1fr;
  }

  .topbar{
    height:auto;
    min-height:62px;
    padding:10px 14px;
  }

  .topbar-title{
    font-size:15px;
  }

<script>

/* ============================================================
   CONSTANTS
============================================================ */

const STORAGE_KEY = "alfaprom_kp_editor_v5";

const OLD_KEYS = [
  "alfaprom_kp_editor_v4",
  "alfaprom_kp_editor_v3",
  "alfaprom_kp_editor_v2",
  "alfaprom_kp_editor_v1"
];

const DB_NAME = "alfaprom_kp_editor_images";

/*
  Версия 3.
  При переходе со старой версии база фотографий
  пересоздаётся. Старые фото пользователю не нужны.
*/
const DB_VERSION = 3;

const STORE_NAME = "photos";

const DEFAULT_PHOTO_SIZE_MM = 58;
const MIN_PHOTO_SIZE_MM = 40;
const MAX_PHOTO_SIZE_MM = 82;
const MM_TO_PX = 3.7795275591;

const DEFAULT_ADVANTAGES = [

  "На рынке с 2017 г.",

  "Нам доверяют крупные федеральные заказчики",

  "Не продаем «железо», а решаем задачу под ключ",

  "ОСЗ (Оперативная Служба Заботы) - реагирование сервиса в течении 5 минут!",

  "ГЛЦ (Гарантия Лучшей Цены)"

];


let db = null;


/* ============================================================
   PRODUCT FACTORY
============================================================ */

function createProduct(){

  return {

    id:
      "product_" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .slice(2),

    productName:"",
    description:"",
    note:"",

    price:"",
    discountPrice:"",
    currency:"RUB",

    status:"available",

    priceComment:"",

    specsText:"",

    videoUrl:"",

    photoIds:[],

    /*
      Размер каждой фотографии хранится отдельно.
      Ключ = photoId.
      Значение = размер рамки в мм.
    */
    photoSizes:{}

  };

}


/* ============================================================
   GLOBAL STATE
============================================================ */

const state = {

  products: [
    createProduct()
  ],

  managerName:"",

  managerPhone:"",

  advantages:DEFAULT_ADVANTAGES.slice()

};


/* ============================================================
   INDEXED DB
============================================================ */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(
        DB_NAME,
        DB_VERSION
      );


    request.onupgradeneeded = function(e){

      const database =
        e.target.result;

      const oldVersion =
        e.oldVersion || 0;


      /*
        Старые версии базы содержали несовместимую
        структуру ключей.

        Поскольку старые фотографии нам не нужны,
        при переходе на новую версию полностью
        пересоздаём хранилище.
      */

      if(
        oldVersion < 3 &&
        database.objectStoreNames.contains(STORE_NAME)
      ){

        database.deleteObjectStore(
          STORE_NAME
        );

      }


      if(
        !database.objectStoreNames.contains(
          STORE_NAME
        )
      ){

        database.createObjectStore(
          STORE_NAME
        );

      }

    };


    request.onsuccess = function(){

      db = request.result;

      resolve(db);

    };


    request.onerror = function(){

      reject(request.error);

    };

  });

}


async function ensureDB(){

  if(db){

    return db;

  }

  return await openDB();

}


/* ============================================================
   PHOTO PREPARATION
============================================================ */

function preparePhoto(file){

  return new Promise((resolve,reject)=>{

    const url =
      URL.createObjectURL(
        file
      );

    const image =
      new Image();


    image.onload = ()=>{

      try{

        const sourceWidth =
          image.naturalWidth ||
          image.width;

        const sourceHeight =
          image.naturalHeight ||
          image.height;


        if(
          !sourceWidth ||
          !sourceHeight
        ){

          throw new Error(
            "Не удалось определить размер фотографии"
          );

        }


        const maxSize = 1600;


        const squareSize =
          Math.min(
            maxSize,
            Math.max(
              sourceWidth,
              sourceHeight
            )
          );


        const canvas =
          document.createElement(
            "canvas"
          );


        canvas.width =
          squareSize;

        canvas.height =
          squareSize;


        const context =
          canvas.getContext(
            "2d"
          );


        if(!context){

          throw new Error(
            "Не удалось создать обработчик изображения"
          );

        }


        context.fillStyle =
          "#ffffff";

        context.fillRect(
          0,
          0,
          squareSize,
          squareSize
        );


        const scale =
          Math.min(
            squareSize / sourceWidth,
            squareSize / sourceHeight
          );


        const width =
          Math.round(
            sourceWidth * scale
          );


        const height =
          Math.round(
            sourceHeight * scale
          );


        const x =
          Math.round(
            (squareSize - width) / 2
          );


        const y =
          Math.round(
            (squareSize - height) / 2
          );


        context.drawImage(
          image,
          x,
          y,
          width,
          height
        );


        canvas.toBlob(
          blob=>{

            URL.revokeObjectURL(
              url
            );


            if(!blob){

              reject(
                new Error(
                  "Не удалось обработать фотографию"
                )
              );

              return;

            }


            resolve(
              blob
            );

          },
          "image/jpeg",
          0.88
        );

      }catch(error){

        URL.revokeObjectURL(
          url
        );

        reject(error);

      }

    };


    image.onerror = ()=>{

      URL.revokeObjectURL(
        url
      );

      reject(
        new Error(
          "Не удалось открыть изображение"
        )
      );

    };


    image.src = url;

  });

}


/* ============================================================
   PHOTO DB
============================================================ */

function createPhotoId(){

  return (
    "photo_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2)
  );

}


async function savePhoto(blob){

  const database =
    await ensureDB();


  const photoId =
    createPhotoId();


  return new Promise((resolve,reject)=>{

    try{

      const transaction =
        database.transaction(
          STORE_NAME,
          "readwrite"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.put(
          blob,
          photoId
        );


      request.onerror = ()=>{

        reject(
          request.error
        );

      };


      transaction.oncomplete = ()=>{

        resolve(
          photoId
        );

      };


      transaction.onerror = ()=>{

        reject(
          transaction.error
        );

      };

    }catch(error){

      reject(error);

    }

  });

}


async function getPhoto(id){

  if(!id){

    return null;

  }


  const database =
    await ensureDB();


  return new Promise((resolve,reject)=>{

    try{

      const transaction =
        database.transaction(
          STORE_NAME,
          "readonly"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.get(id);


      request.onsuccess = ()=>{

        resolve(
          request.result || null
        );

      };


      request.onerror = ()=>{

        reject(
          request.error
        );

      };

    }catch(error){

      reject(error);

    }

  });

}


async function deletePhoto(id){

  if(!id){

    return;

  }


  const database =
    await ensureDB();


  return new Promise((resolve,reject)=>{

    try{

      const transaction =
        database.transaction(
          STORE_NAME,
          "readwrite"
        );


      const store =
        transaction.objectStore(
          STORE_NAME
        );


      const request =
        store.delete(id);


      request.onsuccess =
        ()=>resolve();


      request.onerror =
        ()=>reject(request.error);


      transaction.onerror =
        ()=>reject(transaction.error);

    }catch(error){

      reject(error);

    }

  });

}


/* ============================================================
   PHOTO SIZE HELPERS
============================================================ */

function ensurePhotoSizes(product){

  if(
    !product.photoSizes ||
    typeof product.photoSizes !== "object" ||
    Array.isArray(product.photoSizes)
  ){

    product.photoSizes = {};

  }

}


function getPhotoSize(product,photoId){

  ensurePhotoSizes(product);


  let size =
    Number(
      product.photoSizes[photoId]
    );


  if(
    !Number.isFinite(size)
  ){

    size =
      DEFAULT_PHOTO_SIZE_MM;

  }


  return Math.max(
    MIN_PHOTO_SIZE_MM,
    Math.min(
      MAX_PHOTO_SIZE_MM,
      Math.round(size)
    )
  );

}


function setPhotoSize(
  product,
  photoId,
  size
){

  ensurePhotoSizes(product);


  const normalized =
    Math.max(
      MIN_PHOTO_SIZE_MM,
      Math.min(
        MAX_PHOTO_SIZE_MM,
        Math.round(size)
      )
    );


  product.photoSizes[photoId] =
    normalized;


  return normalized;

}


/* ============================================================
   STATE LOAD / SAVE
============================================================ */

function loadState(){

  let saved = null;


  try{

    saved =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        )
      );

  }catch(e){}


  if(!saved){

    for(const key of OLD_KEYS){

      try{

        const old =
          JSON.parse(
            localStorage.getItem(key)
          );


        if(old){

          saved = old;

          break;

        }

      }catch(e){}

    }

  }


  if(!saved){

    return;

  }


  if(Array.isArray(saved.products)){

    state.products =
      saved.products.map(product=>{

        const normalized = {

          ...createProduct(),

          ...product,

          photoIds:
            Array.isArray(product.photoIds)
              ? product.photoIds
              : [],

          photoSizes:
            product.photoSizes &&
            typeof product.photoSizes === "object" &&
            !Array.isArray(product.photoSizes)
              ? product.photoSizes
              : {}

        };


        return normalized;

      });

  }


  else if(
    saved.productName !== undefined ||
    saved.description !== undefined ||
    saved.price !== undefined
  ){

    const product =
      createProduct();


    const productFields = [

      "productName",
      "description",
      "note",
      "price",
      "discountPrice",
      "currency",
      "status",
      "priceComment",
      "specsText",
      "videoUrl"

    ];


    productFields.forEach(key=>{

      if(saved[key] !== undefined){

        product[key] =
          saved[key];

      }

    });


    state.products = [
      product
    ];

  }


  if(!state.products.length){

    state.products = [
      createProduct()
    ];

  }


  state.managerName =
    saved.managerName || "";


  state.managerPhone =
    saved.managerPhone || "";


  state.advantages =
    DEFAULT_ADVANTAGES.slice();

}


function saveState(){

  localStorage.setItem(

    STORAGE_KEY,

    JSON.stringify({

      products:state.products,

      managerName:
        state.managerName,

      managerPhone:
        state.managerPhone,

      advantages:
        DEFAULT_ADVANTAGES.slice()

    })

  );

}


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){

  return String(value ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return escapeHtml(value);

}


function formatNumber(value){

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){

    return "";

  }


  const number =
    Number(value);


  if(Number.isNaN(number)){

    return escapeHtml(value);

  }


  return new Intl.NumberFormat(
    "ru-RU",
    {
      maximumFractionDigits:2
    }
  ).format(number);

}


function currencySymbol(currency){

  switch(currency){

    case "USD":
      return "$";

    case "EUR":
      return "€";

    default:
      return "₽";

  }

}


function formatPrice(
  value,
  currency
){

  if(
    value === "" ||
    value === null ||
    value === undefined
  ){

    return "";

  }


  return (

    formatNumber(value) +

    " " +

    currencySymbol(currency)

  );

}


function safeFileName(name){

  let result =
    String(
      name ||
      "Коммерческое предложение"
    )

    .replace(
      /[<>:"/\\|?*\x00-\x1F]/g,
      " "
    )

    .replace(
      /\s+/g,
      " "
    )

    .trim();


  if(!result){

    result =
      "Коммерческое предложение";

  }


  return (
    result +
    ", предложение от АЛЬФАПРОМ"
  );

}


function parseSpecs(text){

  const rows = [];


  String(text || "")

    .split(/\r?\n/)

    .map(
      line=>line.trim()
    )

    .filter(Boolean)

    .forEach(line=>{

      const colon =
        line.indexOf(":");


      if(colon > -1){

        const name =
          line
            .slice(0,colon)
            .trim();


        const value =
          line
            .slice(colon + 1)
            .trim();


        if(name || value){

          rows.push([
            name,
            value
          ]);

        }

      }else{

        rows.push([
          line,
          ""
        ]);

      }

    });


  return rows;

}

/* ============================================================
   EDITOR PHOTOS
============================================================ */

async function renderEditorPhotos(product){

  const grid =
    document.querySelector(
      `[data-photo-grid="${product.id}"]`
    );


  if(!grid){

    return;

  }


  grid.innerHTML = "";


  if(
    !Array.isArray(product.photoIds)
  ){

    product.photoIds = [];

  }


  ensurePhotoSizes(product);


  /*
    Если фотографий нет — показываем
    один аккуратный загрузчик.
  */

  if(!product.photoIds.length){

    const item =
      document.createElement(
        "div"
      );


    item.className =
      "photo-editor-item";


    item.innerHTML = `

      <div
        class="photo-drop"
        data-photo-drop-new="${product.id}"
      >

        <div class="photo-placeholder">

          Нажмите сюда или перетащите фотографию

          <br>

          <small>
            Можно добавить несколько фотографий
          </small>

        </div>

      </div>

    `;


    grid.appendChild(item);


    bindNewPhotoDrop(
      product,
      item
    );


    return;

  }


  for(
    let index = 0;
    index < product.photoIds.length;
    index++
  ){

    const photoId =
      product.photoIds[index];


    const photoSize =
      getPhotoSize(
        product,
        photoId
      );


    const editorSizePx =
      Math.round(
        photoSize *
        MM_TO_PX
      );


    const item =
      document.createElement(
        "div"
      );


    item.className =
      "photo-editor-item";


    item.style.width =
      `${editorSizePx}px`;


    item.innerHTML = `

      <div
        class="photo-drop"
        data-photo-drop="${product.id}-${index}"
        style="
          width:${editorSizePx}px;
          height:${editorSizePx}px;
        "
      >

        <div class="photo-placeholder">
          Загрузка...
        </div>

      </div>


      <div class="photo-size-label">
        Размер в КП: ${photoSize} × ${photoSize} мм
      </div>


      <button
        type="button"
        class="photo-item-remove"
        data-remove-photo-index="${product.id}-${index}"
      >
        Удалить фото
      </button>

    `;


    grid.appendChild(item);


    const drop =
      item.querySelector(
        `[data-photo-drop="${product.id}-${index}"]`
      );


    const remove =
      item.querySelector(
        `[data-remove-photo-index="${product.id}-${index}"]`
      );


    try{

      const blob =
        await getPhoto(
          photoId
        );


      if(!blob){

        product.photoIds =
          product.photoIds.filter(
            id=>id !== photoId
          );


        delete product.photoSizes[photoId];

        saveState();

        item.remove();

        continue;

      }


      const url =
        URL.createObjectURL(
          blob
        );


      drop.classList.add(
        "has-image"
      );


      drop.innerHTML = `

        <img
          src="${url}"
          alt="Фото оборудования"
        >

        <div
          class="photo-resize-handle"
          title="Потяните, чтобы изменить размер"
        ></div>

      `;


      const image =
        drop.querySelector("img");


      image.onload = ()=>{

        URL.revokeObjectURL(
          url
        );

      };


      /*
        Важно:
        клик по самому фото открывать
        файловый диалог больше не должен.
        Изменение размера происходит
        только за оранжевый угол.
      */

      bindPhotoResize(
        product,
        photoId,
        item,
        drop
      );

    }catch(error){

      console.error(
        "Photo render error:",
        error
      );

    }


    remove.addEventListener(
      "click",
      async e=>{

        e.preventDefault();

        e.stopPropagation();


        const currentIndex =
          product.photoIds.indexOf(
            photoId
          );


        if(currentIndex === -1){

          return;

        }


        try{

          await deletePhoto(
            photoId
          );

        }catch(error){

          console.warn(
            "Не удалось удалить фото:",
            error
          );

        }


        product.photoIds.splice(
          currentIndex,
          1
        );


        delete product.photoSizes[photoId];


        saveState();

        renderProductsEditor();

        renderPreview();

      }
    );

  }

}


/* ============================================================
   PHOTO RESIZE
============================================================ */

function bindPhotoResize(
  product,
  photoId,
  item,
  drop
){

  const handle =
    drop.querySelector(
      ".photo-resize-handle"
    );


  if(!handle){

    return;

  }


  let resizing = false;
  let startX = 0;
  let startY = 0;
  let startSize = DEFAULT_PHOTO_SIZE_MM;


  function applySize(size){

    const normalized =
      setPhotoSize(
        product,
        photoId,
        size
      );


    const px =
      Math.round(
        normalized *
        MM_TO_PX
      );


    drop.style.width =
      `${px}px`;

    drop.style.height =
      `${px}px`;

    item.style.width =
      `${px}px`;


    const label =
      item.querySelector(
        ".photo-size-label"
      );


    if(label){

      label.textContent =
        `Размер в КП: ${normalized} × ${normalized} мм`;

    }

  }


  function onPointerMove(e){

    if(!resizing){

      return;

    }


    const dx =
      e.clientX -
      startX;


    const dy =
      e.clientY -
      startY;


    /*
      Используем среднее движение по X/Y,
      чтобы квадрат увеличивался равномерно.
    */

    const averageDelta =
      (dx + dy) / 2;


    const sizeDelta =
      averageDelta /
      MM_TO_PX;


    applySize(
      startSize +
      sizeDelta
    );

  }


  function stopResize(){

    if(!resizing){

      return;

    }


    resizing = false;

    document.body.style.userSelect =
      "";


    window.removeEventListener(
      "pointermove",
      onPointerMove
    );


    window.removeEventListener(
      "pointerup",
      stopResize
    );


    saveState();

    renderPreview();

  }


  handle.addEventListener(
    "pointerdown",
    e=>{

      e.preventDefault();

      e.stopPropagation();


      resizing = true;

      startX =
        e.clientX;

      startY =
        e.clientY;

      startSize =
        getPhotoSize(
          product,
          photoId
        );


      document.body.style.userSelect =
        "none";


      window.addEventListener(
        "pointermove",
        onPointerMove
      );


      window.addEventListener(
        "pointerup",
        stopResize
      );

    }
  );

}


/* ============================================================
   NEW PHOTO DROP
============================================================ */

function bindNewPhotoDrop(
  product,
  item
){

  const drop =
    item.querySelector(
      `[data-photo-drop-new="${product.id}"]`
    );


  if(!drop){

    return;

  }


  drop.addEventListener(
    "click",
    e=>{

      e.preventDefault();

      const input =
        document.querySelector(
          `[data-photo-input="${product.id}"]`
        );


      if(input){

        input.click();

      }

    }
  );


  drop.addEventListener(
    "dragover",
    e=>{

      e.preventDefault();

      e.stopPropagation();

      drop.classList.add(
        "dragover"
      );

    }
  );


  drop.addEventListener(
    "dragleave",
    e=>{

      e.preventDefault();

      drop.classList.remove(
        "dragover"
      );

    }
  );


  drop.addEventListener(
    "drop",
    async e=>{

      e.preventDefault();

      e.stopPropagation();

      drop.classList.remove(
        "dragover"
      );


      const files =
        Array.from(
          e.dataTransfer.files || []
        ).filter(
          file=>
            file.type &&
            file.type.startsWith("image/")
        );


      if(files.length){

        await handlePhotos(
          product,
          files
        );

      }

    }
  );

}


/* ============================================================
   BIND PRODUCT EVENTS
============================================================ */

function bindProductEditorEvents(){

  document
    .querySelectorAll(
      ".product-editor-card"
    )
    .forEach(card=>{

      const productId =
        card.dataset.productId;


      const product =
        state.products.find(
          p=>p.id === productId
        );


      if(!product){

        return;

      }


      card
        .querySelectorAll(
          "[data-field]"
        )
        .forEach(field=>{

          const eventName =
            field.tagName === "SELECT"
              ? "change"
              : "input";


          field.addEventListener(
            eventName,
            ()=>{

              product[
                field.dataset.field
              ] =
                field.value;


              saveState();

              renderPreview();

            }
          );

        });


      card
        .querySelectorAll(
          "[data-product-status]"
        )
        .forEach(button=>{

          button.addEventListener(
            "click",
            ()=>{

              product.status =
                button.dataset.status;


              saveState();

              renderProductsEditor();

              renderPreview();

            }
          );

        });


      const choose =
        card.querySelector(
          `[data-choose-photo="${productId}"]`
        );


      const input =
        card.querySelector(
          `[data-photo-input="${productId}"]`
        );


      choose.addEventListener(
        "click",
        e=>{

          e.preventDefault();

          e.stopPropagation();

          input.click();

        }
      );


      input.addEventListener(
        "change",
        async e=>{

          const files =
            Array.from(
              e.target.files || []
            );


          if(files.length){

            await handlePhotos(
              product,
              files
            );

          }


          input.value = "";

        }
      );


      const removeProduct =
        card.querySelector(
          `[data-remove-product="${productId}"]`
        );


      if(removeProduct){

        removeProduct.addEventListener(
          "click",
          async ()=>{

            if(
              !confirm(
                "Удалить это оборудование из КП?"
              )
            ){

              return;

            }


            if(
              Array.isArray(
                product.photoIds
              )
            ){

              for(
                const photoId
                of product.photoIds
              ){

                try{

                  await deletePhoto(
                    photoId
                  );

                }catch(error){}

              }

            }


            state.products =
              state.products.filter(
                p=>p.id !== productId
              );


            if(!state.products.length){

              state.products = [
                createProduct()
              ];

            }


            saveState();

            renderProductsEditor();

            renderPreview();

          }
        );

      }

    });

}


/* ============================================================
   PHOTO HANDLING
============================================================ */

async function handlePhotos(
  product,
  files
){

  const validFiles =
    files.filter(
      file=>
        file &&
        file.type &&
        file.type.startsWith("image/")
    );


  if(!validFiles.length){

    alert(
      "Можно загружать только изображения."
    );

    return;

  }


  if(!Array.isArray(product.photoIds)){

    product.photoIds = [];

  }


  ensurePhotoSizes(product);


  const newPhotoIds = [];


  try{

    for(
      const file
      of validFiles
    ){

      const preparedPhoto =
        await preparePhoto(
          file
        );


      const newPhotoId =
        await savePhoto(
          preparedPhoto
        );


      newPhotoIds.push(
        newPhotoId
      );


      /*
        Каждому новому фото сразу
        назначаем компактный размер.
      */

      product.photoSizes[newPhotoId] =
        DEFAULT_PHOTO_SIZE_MM;

    }


    product.photoIds.push(
      ...newPhotoIds
    );


    saveState();

    renderProductsEditor();

    renderPreview();

  }catch(error){

    console.error(
      "Photo save error:",
      error
    );


    for(
      const photoId
      of newPhotoIds
    ){

      try{

        await deletePhoto(
          photoId
        );

      }catch(deleteError){}

    }


    alert(
      "Не удалось обработать и сохранить фотографию.\n\n" +
      (
        error.message ||
        "Попробуйте выбрать изображение ещё раз."
      )
    );

  }

}

async function getPhotoDataUrl(
  photoId
){

  if(!photoId){

    return "";

  }


  const blob =
    await getPhoto(
      photoId
    );


  if(!blob){

    return "";

  }


  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload = ()=>{

        resolve(
          reader.result
        );

      };


      reader.onerror = ()=>{

        reject(
          reader.error
        );

      };


      reader.readAsDataURL(
        blob
      );

    }
  );

}


async function getProductPhotosData(
  product
){

  if(
    !Array.isArray(
      product.photoIds
    )
  ){

    return [];

  }


  const result = [];


  for(
    const photoId
    of product.photoIds
  ){

    try{

      const dataUrl =
        await getPhotoDataUrl(
          photoId
        );


      if(dataUrl){

        result.push({

          photoId:photoId,

          dataUrl:dataUrl

        });

      }

    }catch(error){

      console.error(
        "Photo data error:",
        error
      );

    }

  }


  return result;

}

/* ============================================================

============================================================ */

function getA4SizePx(){

  const temp =
    document.createElement(
      "div"
    );


  temp.style.width =
    "210mm";


  temp.style.height =
    "297mm";


  temp.style.position =
    "absolute";


  temp.style.visibility =
    "hidden";


  document.body.appendChild(
    temp
  );


  const width =
    temp.getBoundingClientRect().width;


  const height =
    temp.getBoundingClientRect().height;


  temp.remove();


  return {
    width,
    height
  };

}


function fitPreviewPages(){

  const scroll =
    document.getElementById(
      "previewScroll"
    );


  const shells =
    document.querySelectorAll(
      ".preview-page-shell"
    );


  if(!scroll || !shells.length){

    return;

  }


  const availableWidth =
    Math.max(
      100,
      scroll.clientWidth - 40
    );


  const availableHeight =
    Math.max(
      100,
      scroll.clientHeight - 40
    );


  const a4 =
    getA4SizePx();


  const scale =
    Math.min(

      availableWidth /
        a4.width,

      availableHeight /
        a4.height

    );


  shells.forEach(shell=>{

    shell.style.width =
      `${a4.width * scale}px`;


    shell.style.height =
      `${a4.height * scale}px`;


    const page =
      shell.querySelector(
        ".preview-page-scaled"
      );


    if(page){

      page.style.transform =
        `scale(${scale})`;

    }

  });

}

        },

            "css",

      .from(wrapper)

      (

  }

/* ============================================================
   DOCX HELPERS
============================================================ */

async function blobToUint8Array(blob){

  const buffer =
    await blob.arrayBuffer();


  return new Uint8Array(
    buffer
  );

}


function getImageDimensions(blob){

  return new Promise(
    (resolve,reject)=>{

      const url =
        URL.createObjectURL(
          blob
        );


      const image =
        new Image();


      image.onload = ()=>{

        const width =
          image.naturalWidth ||
          image.width;


        const height =
          image.naturalHeight ||
          image.height;


        URL.revokeObjectURL(
          url
        );


        resolve({
          width,
          height
        });

      };


      image.onerror = ()=>{

        URL.revokeObjectURL(
          url
        );


        reject(
          new Error(
            "Не удалось определить размер изображения"
          )
        );

      };


      image.src = url;

    }
  );

}


function calculateDocxImageSize(
  width,
  height,
  selectedSizeMm
){

  /*
    В DOCX стараемся повторить размер,
    выбранный пользователем в редакторе.

    При этом оставляем разумные границы,
    чтобы фотографии не ломали таблицу.
  */

  const requestedPx =
    Math.round(
      selectedSizeMm *
      MM_TO_PX
    );


  const maxWidth =
    310;


  const maxHeight =
    310;


  const target =
    Math.min(
      requestedPx,
      maxWidth,
      maxHeight
    );


  const ratio =
    Math.min(
      target / width,
      target / height,
      1
    );


  return {

    width:
      Math.max(
        1,
        Math.round(
          width * ratio
        )
      ),

    height:
      Math.max(
        1,
        Math.round(
          height * ratio
        )
      )

  };

}

/* ============================================================

async function createDocx(){

  const children = [];


  for(
    let index = 0;
    index < state.products.length;
    index++
  ){

    const product =
      state.products[index];


    if(index > 0){

      children.push(

        new docx.Paragraph({

          pageBreakBefore:true,

          children:[]

        })

      );

    }


    children.push(

      new docx.Paragraph({

        border:{

          bottom:{

            color:"FF8100",

            space:8,

            style:
              docx.BorderStyle
                .SINGLE,

            size:12

          }

        },

        spacing:{
          after:300
        },

        children:[

          new docx.TextRun({

            text:"АЛЬФАПРОМ",

            bold:true,

            color:"FF8100",

            size:32

          })

        ]

      })

    );


    children.push(

      new docx.Paragraph({

        spacing:{
          after:150
        },

        children:[

          new docx.TextRun({

            text:
              "Коммерческое предложение",

            bold:true,

            size:32

          })

        ]

      })

    );


    children.push(

      new docx.Paragraph({

        spacing:{
          after:250
        },

        children:[

          new docx.TextRun({

            text:
              product.productName ||
              `Оборудование №${index + 1}`,

            bold:true,

            size:28

          })

        ]

      })

    );


    /*
      Фотографии в DOCX.
      Теперь вместе с blob сохраняем
      photoId, чтобы использовать выбранный
      пользователем размер.
    */

    const photoBlobs = [];


    if(
      Array.isArray(
        product.photoIds
      )
    ){

      for(
        const photoId
        of product.photoIds
      ){

        try{

          const blob =
            await getPhoto(
              photoId
            );


          if(blob){

            photoBlobs.push({

              photoId:photoId,

              blob:blob

            });

          }

        }catch(error){

          console.error(
            "DOCX photo load error:",
            error
          );

        }

      }

    }


    for(
      let photoIndex = 0;
      photoIndex < photoBlobs.length;
      photoIndex += 2
    ){

      const rowPhotos =
        photoBlobs.slice(
          photoIndex,
          photoIndex + 2
        );


      const cells = [];


      for(
        const photoItem
        of rowPhotos
      ){

        try{

          const photoBlob =
            photoItem.blob;


          const bytes =
            await blobToUint8Array(
              photoBlob
            );


          const dimensions =
            await getImageDimensions(
              photoBlob
            );


          const selectedSize =
            getPhotoSize(
              product,
              photoItem.photoId
            );


          const imageSize =
            calculateDocxImageSize(
              dimensions.width,
              dimensions.height,
              selectedSize
            );


          let imageType = "jpg";


          if(
            photoBlob.type ===
            "image/png"
          ){

            imageType = "png";

          }


          cells.push(

            new docx.TableCell({

              width:{
                size:50,
                type:
                  docx.WidthType
                    .PERCENTAGE
              },

              children:[

                new docx.Paragraph({

                  alignment:
                    docx.AlignmentType
                      .CENTER,

                  children:[

                    new docx.ImageRun({

                      data:bytes,

                      transformation:{
                        width:imageSize.width,
                        height:imageSize.height
                      },

                      type:imageType

                    })

                  ]

                })

              ]

            })

          );

        }catch(error){

          console.error(
            "DOCX image error:",
            error
          );

        }

      }


      while(cells.length < 2){

        cells.push(

          new docx.TableCell({

            width:{
              size:50,
              type:
                docx.WidthType
                  .PERCENTAGE
            },

            children:[
              new docx.Paragraph({
                children:[]
              })
            ]

          })

        );

      }


      if(cells.length){

        children.push(

          new docx.Table({

            width:{
              size:100,
              type:
                docx.WidthType
                  .PERCENTAGE
            },

            rows:[

              new docx.TableRow({

                children:cells

              })

            ],

            borders:{

              top:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              },

              bottom:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              },

              left:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              },

              right:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              },

              insideHorizontal:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              },

              insideVertical:{
                style:
                  docx.BorderStyle.NONE,
                size:0,
                color:"FFFFFF"
              }

            }

          })

        );

      }

    }


    if(
      product.description.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:150
          },

          children:[

            new docx.TextRun({

              text:
                product.description,

              size:21

            })

          ]

        })

      );

    }


    if(
      product.note.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:150
          },

          children:[

            new docx.TextRun({

              text:
                product.note,

              italics:true,

              color:"666666",

              size:19

            })

          ]

        })

      );

    }


    children.push(
      ...createDocxSpecs(
        product
      )
    );


    if(
      product.videoUrl.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            before:200,
            after:200
          },

          children:[

            new docx.ExternalHyperlink({

              link:
                product.videoUrl,

              children:[

                new docx.TextRun({

                  text:
                    "Смотреть видео оборудования",

                  bold:true,

                  color:"FF8100",

                  underline:{},

                  size:19

                })

              ]

            })

          ]

        })

      );

    }


    if(
      product.price ||
      product.discountPrice
    ){

      if(product.price){

        children.push(

          new docx.Paragraph({

            spacing:{
              before:150,
              after:80
            },

            children:[

              new docx.TextRun({

                text:
                  `Цена: ${formatPrice(
                    product.price,
                    product.currency
                  )}`,

                bold:true,

                size:26

              })

            ]

          })

        );

      }


      if(product.discountPrice){

        children.push(

          new docx.Paragraph({

            spacing:{
              after:100
            },

            children:[

              new docx.TextRun({

                text:
                  `Цена со скидкой: ${formatPrice(
                    product.discountPrice,
                    product.currency
                  )}`,

                bold:true,

                color:"D93025",

                size:26

              })

            ]

          })

        );

      }

    }


    children.push(

      new docx.Paragraph({

        spacing:{
          after:80
        },

        children:[

          new docx.TextRun({

            text:
              product.status === "order"
                ? "Под заказ"
                : "В наличии",

            bold:true,

            color:
              product.status === "order"
                ? "B96A00"
                : "168A45",

            size:21

          })

        ]

      })

    );


    if(
      product.priceComment.trim()
    ){

      children.push(

        new docx.Paragraph({

          spacing:{
            after:180
          },

          children:[

            new docx.TextRun({

              text:
                product.priceComment,

              color:"666666",

              size:18

            })

          ]

        })

      );

    }


    children.push(

      new docx.Paragraph({

        spacing:{
          before:300,
          after:180
        },

        children:[

          new docx.TextRun({

            text:
              "Почему мы?",

            bold:true,

            size:28

          })

        ]

      })

    );


    DEFAULT_ADVANTAGES.forEach(
      item=>{

        children.push(

          new docx.Paragraph({

            bullet:{
              level:0
            },

            spacing:{
              after:100
            },

            children:[

              new docx.TextRun({

                text:item,

                bold:true,

                size:22

              })

            ]

          })

        );

      }
    );

  }


  children.push(

    new docx.Paragraph({

      spacing:{
        before:300,
        after:100
      },

      children:[

        new docx.TextRun({

          text:
            "Контактное лицо",

          bold:true,

          size:21

        })

      ]

    })

  );


  if(
    state.managerName.trim()
  ){

    children.push(

      new docx.Paragraph({

        spacing:{
          after:50
        },

        children:[

          new docx.TextRun({

            text:
              state.managerName,

            bold:true,

            size:20

          })

        ]

      })

    );

  }


  if(
    state.managerPhone.trim()
  ){

    children.push(

      new docx.Paragraph({

        spacing:{
          after:250
        },

        children:[

          new docx.TextRun({

            text:
              state.managerPhone,

            size:20

          })

        ]

      })

    );

  }


  const footer =
    new docx.Footer({

      children:[

        new docx.Paragraph({

          border:{

            top:{

              color:"FF8100",

              space:4,

              style:
                docx.BorderStyle
                  .SINGLE,

              size:10

            }

          },

          spacing:{
            before:120
          },

          children:[

            new docx.TextRun({

              text:
                "АЛЬФАПРОМ  |  Оборудование для пищевого производства и упаковки  |  alfaprom.org",

              bold:true,

              color:"FF8100",

              size:17

            })

          ]

        })

      ]

    });


  const document =
    new docx.Document({

      sections:[{

        properties:{

          page:{

            margin:{

              top:800,

              right:900,

              bottom:900,

              left:900

            }

          }

        },

        headers:[],

        footers:[
          footer
        ],

        children:children

      }]

    });


  return docx.Packer.toBlob(
    document
  );

}


/* ============================================================
   DOWNLOAD DOCX
============================================================ */

async function downloadDOCX(){

  const button =
    document.getElementById(
      "downloadDocxBtn"
    );


  button.disabled = true;

  button.textContent =
    "Формирование DOCX...";


  try{

    const blob =
      await createDocx();


    const filename =
      safeFileName(
        state.products[0]?.productName
      ) +
      ".docx";


    const url =
      URL.createObjectURL(
        blob
      );


    const link =
      document.createElement(
        "a"
      );


    link.href = url;

    link.download =
      filename;


    document.body.appendChild(
      link
    );


    link.click();

    link.remove();


    setTimeout(
      ()=>{
        URL.revokeObjectURL(
          url
        );
      },
      1000
    );

  }catch(error){

    console.error(
      error
    );


    alert(
      "Не удалось сформировать DOCX.\n\n" +
      (
        error.message ||
        error
      )
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "Скачать DOCX";

  }

}
