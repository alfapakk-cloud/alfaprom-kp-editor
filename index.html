<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Конструктор КП — АЛЬФАПРОМ</title>

<style>
:root{
  --orange:#ff8100;
  --orange-dark:#ff8100;
  --text:#202124;
  --muted:#6b7280;
  --border:#d9dce1;
  --bg:#f4f5f7;
  --green:#168a45;
  --red:#d93025;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* =========================
   TOP TOOLBAR
========================= */

.topbar{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  background:#fff;
  border-bottom:2px solid var(--orange);
}

.topbar-title{
  font-size:18px;
  font-weight:700;
}

.toolbar{
  display:flex;
  gap:8px;
}

.btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px 14px;
  font-weight:600;
  transition:.15s;
}

.btn:hover{
  border-color:var(--orange);
}

.btn-primary{
  background:var(--orange);
  border-color:var(--orange);
  color:#fff;
}

.btn-primary:hover{
  background:var(--orange);
  border-color:var(--orange);
}

.btn-danger{
  color:#b42318;
}

/* =========================
   MAIN 50/50
========================= */

.layout{
  flex:1;
  min-height:0;
  display:grid;
  grid-template-columns:50% 50%;
}

/* =========================
   EDITOR
========================= */

.editor{
  min-width:0;
  overflow:auto;
  padding:20px;
  background:#f7f8fa;
  border-right:1px solid #ddd;
}

.editor-section{
  background:#fff;
  border:1px solid var(--border);
  border-radius:12px;
  padding:18px;
  margin-bottom:16px;
}

.editor-section h2{
  margin:0 0 16px;
  font-size:18px;
}

.editor-section h3{
  margin:0 0 14px;
  font-size:16px;
}

.field{
  margin-bottom:14px;
}

.field:last-child{
  margin-bottom:0;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:#40444a;
}

input[type="text"],
input[type="tel"],
input[type="number"],
input[type="url"],
textarea,
select{
  width:100%;
  border:1px solid #cfd3d8;
  border-radius:8px;
  padding:10px 11px;
  background:#fff;
  color:var(--text);
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--orange);
}

textarea{
  min-height:90px;
  resize:vertical;
  line-height:1.45;
}

.specs-textarea{
  min-height:170px;
}

.two-cols{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.three-cols{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:12px;
}

.status-buttons{
  display:flex;
  gap:8px;
}

.status-button{
  flex:1;
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:8px;
  padding:9px;
  font-weight:600;
}

.status-button.active{
  border-color:var(--orange);
  box-shadow:0 0 0 1px var(--orange) inset;
}

.status-button[data-status="available"].active{
  color:var(--green);
}

.status-button[data-status="order"].active{
  color:#b96a00;
}

/* =========================
   EQUIPMENT PHOTO
========================= */

.photo-editor{
  margin-bottom:16px;
}

.photo-drop{
  width:100%;
  height:210px;
  border:2px dashed #cfd3d8;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fafafa;
  overflow:hidden;
  position:relative;
  transition:.15s;
}

.photo-drop:hover{
  border-color:var(--orange);
}

.photo-drop.has-image{
  border-style:solid;
  border-color:#d7d9dc;
  background:#fff;
}

.photo-drop img{
  width:100%;
  height:100%;
  object-fit:contain;
  padding:8px;
  display:block;
}

.photo-placeholder{
  color:#73777d;
  font-size:13px;
  line-height:1.5;
  padding:20px;
}

.photo-actions{
  margin-top:8px;
  display:flex;
  gap:8px;
}

.small-btn{
  border:1px solid #d3d6da;
  background:#fff;
  border-radius:7px;
  padding:7px 10px;
  font-size:12px;
}

.small-btn:hover{
  border-color:var(--orange);
}

.file-input{
  display:none;
}

/* =========================
   PREVIEW AREA
========================= */

.preview-side{
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#e8eaed;
}

.preview-title{
  flex:none;
  height:48px;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#fff;
  border-bottom:1px solid #d7d9dc;
  font-size:16px;
  font-weight:700;
}

.preview-scroll{
  flex:1;
  min-height:0;
  overflow:auto;
  padding:24px;
}

.preview-pages{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:24px;
}

/* =========================
   A4 PAGE
========================= */

.kp-page{
  width:210mm;
  min-height:297mm;
  height:297mm;
  background:#fff;
  position:relative;
  box-shadow:0 3px 15px rgba(0,0,0,.14);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  flex:none;
}

.kp-content{
  flex:1;
  min-height:0;
  padding:15mm 15mm 10mm;
  overflow:hidden;
}

.kp-header{
  height:31mm;
  display:flex;
  align-items:center;
  border-bottom:2px solid var(--orange);
  margin-bottom:8mm;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-mark{
  width:34px;
  height:34px;
  background:var(--orange);
  color:#fff;
  border-radius:5px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:800;
}

.brand-name{
  color:var(--orange);
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.kp-title{
  font-size:23px;
  font-weight:800;
  margin-bottom:6mm;
}

.kp-product-name{
  font-size:20px;
  font-weight:750;
  line-height:1.2;
  margin-bottom:5mm;
}

/* =========================
   PRODUCT PHOTO
========================= */

.product-photo-frame{
  width:100%;
  height:66mm;
  border:1px solid #e0e2e5;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  background:#fff;
  margin-bottom:5mm;
}

.product-photo-frame img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
  padding:3mm;
}

/* =========================
   DESCRIPTION
========================= */

.kp-description{
  font-size:12.5px;
  line-height:1.55;
  white-space:pre-wrap;
  margin-bottom:4mm;
}

.kp-note{
  font-size:11.5px;
  color:#666;
  line-height:1.45;
  white-space:pre-wrap;
  margin-bottom:4mm;
}

/* =========================
   PRICES
========================= */

.price-block{
  margin:3mm 0 5mm;
}

.price-line{
  font-size:17px;
  font-weight:800;
  margin-bottom:2mm;
}

.price-line.discount{
  color:var(--red);
}

.availability{
  font-size:13px;
  font-weight:800;
  margin-bottom:2mm;
}

.availability.available{
  color:var(--green);
}

.availability.order{
  color:#b96a00;
}

.price-comment{
  font-size:11px;
  color:#666;
  line-height:1.4;
  margin-bottom:5mm;
}

/* =========================
   SPECS TABLE
========================= */

.specs-table{
  width:100%;
  border-collapse:collapse;
  font-size:10.5px;
  margin-top:3mm;
}

.specs-table th,
.specs-table td{
  border:1px solid #d9dce0;
  padding:5px 7px;
  text-align:left;
  vertical-align:top;
}

.specs-table th{
  background:var(--orange);
  color:#fff;
  font-weight:800;
}

.specs-table td:first-child{
  width:40%;
  font-weight:650;
}

/* =========================
   VIDEO
========================= */

.video-button{
  display:inline-block;
  margin-top:5mm;
  padding:8px 12px;
  border-radius:6px;
  background:var(--orange);
  color:#fff;
  text-decoration:none;
  font-size:11px;
  font-weight:700;
}

/* =========================
   WHY US
========================= */

.advantages{
  margin-top:auto;
  padding-top:7mm;
}

.advantages-title{
  font-size:18px;
  font-weight:800;
  margin-bottom:5mm;
}

.advantages-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:4mm;
}

.advantage{
  grid-column:span 2;
  min-height:25mm;
  border:1px solid #e1e3e6;
  border-radius:7px;
  padding:4mm;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:16px;
  font-weight:700;
  line-height:1.25;
}

.advantage:nth-child(4){
  grid-column:2 / span 2;
}

.advantage:nth-child(5){
  grid-column:4 / span 2;
}

/* =========================
   FOOTER
========================= */

.kp-footer{
  flex:none;
  height:25mm;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10mm;
  padding:5mm 15mm;
}

.footer-left{
  font-size:12px;
  font-weight:700;
  line-height:1.4;
}

.footer-right{
  text-align:right;
  font-size:12px;
  line-height:1.45;
}

.footer-manager{
  font-weight:800;
}

/* =========================
   EMPTY
========================= */

.empty-state{
  color:#777;
  text-align:center;
  padding:40px 20px;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){
  .layout{
    grid-template-columns:1fr;
  }

  .editor{
    border-right:0;
  }

  .preview-side{
    min-height:800px;
  }

  .two-cols,
  .three-cols{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="topbar">
    <div class="topbar-title">Конструктор коммерческого предложения</div>

    <div class="toolbar">
      <button class="btn btn-primary" id="downloadPdfBtn">
        Скачать PDF
      </button>

      <button class="btn btn-primary" id="downloadDocxBtn">

      </button>
    </div>
  </header>

  <main class="layout">

    <!-- ================= EDITOR ================= -->

    <section class="editor" id="editor">

      <div class="editor-section">

Например:

<script>
/* ============================================================
   ALFAPROM КП EDITOR
============================================================ */

const STORAGE_KEY = "alfaprom_kp_editor_v4";
const OLD_KEYS = [
  "alfaprom_kp_editor_v3",
  "alfaprom_kp_editor_v2",
  "alfaprom_kp_editor_v1"
];

const DB_NAME = "alfaprom_kp_editor_images";
const DB_VERSION = 1;
const STORE_NAME = "photos";

const DEFAULT_ADVANTAGES = [
  "На рынке с 2017 г.",
  "Нам доверяют крупные федеральные заказчики",
  "Не продаем «железо», а решаем задачу под ключ",
  "ОСЗ (Оперативная Служба Заботы) - реагирование сервиса в течении 5 минут!",
  "ГЛЦ (Гарантия Лучшей Цены)"
];

const state = {
  productName: "",
  description: "",
  note: "",
  price: "",
  discountPrice: "",
  currency: "RUB",
  status: "available",
  priceComment: "",
  specsText: "",
  videoUrl: "",
  managerName: "",
  managerPhone: "",
  photoId: "",
  advantages: DEFAULT_ADVANTAGES.slice()
};

let db = null;


/* ============================================================
   INDEXED DB
============================================================ */

function openDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(e){
      const database = e.target.result;

      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME);
      }
    };

    request.onsuccess = function(){
      db = request.result;
      resolve(db);
    };

    request.onerror = function(){
      reject(request.error);
    };
  });
}


function savePhoto(blob){
  return new Promise((resolve,reject)=>{
    const id = "photo_" + Date.now() + "_" + Math.random().toString(36).slice(2);

    const transaction = db.transaction(STORE_NAME,"readwrite");
    transaction.objectStore(STORE_NAME).put(blob,id);

    transaction.oncomplete = ()=>{
      resolve(id);
    };

    transaction.onerror = ()=>{
      reject(transaction.error);
    };
  });
}


function getPhoto(id){
  return new Promise((resolve,reject)=>{
    if(!id){
      resolve(null);
      return;
    }

    const transaction = db.transaction(STORE_NAME,"readonly");
    const request = transaction.objectStore(STORE_NAME).get(id);

    request.onsuccess = ()=>{
      resolve(request.result || null);
    };

    request.onerror = ()=>{
      reject(request.error);
    };
  });
}


function deletePhoto(id){
  return new Promise((resolve,reject)=>{
    if(!id){
      resolve();
      return;
    }

    const transaction = db.transaction(STORE_NAME,"readwrite");
    transaction.objectStore(STORE_NAME).delete(id);

    transaction.oncomplete = ()=>resolve();
    transaction.onerror = ()=>reject(transaction.error);
  });
}


/* ============================================================
   STATE
============================================================ */

function loadState(){

  let saved = null;

  try{
    saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  }catch(e){}

  if(!saved){

    for(const key of OLD_KEYS){
      try{
        const old = JSON.parse(localStorage.getItem(key));

        if(old){
          saved = old;
          break;
        }
      }catch(e){}
    }

  }

  if(saved){

    Object.keys(state).forEach(key=>{
      if(saved[key] !== undefined){
        state[key] = saved[key];
      }
    });

    if(!Array.isArray(state.advantages)){
      state.advantages = DEFAULT_ADVANTAGES.slice();
    }

  }

}


function saveState(){

  const clean = {...state};

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(clean)
  );

}


/* ============================================================
   HELPERS
============================================================ */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function formatNumber(value){

  if(value === "" || value === null || value === undefined){
    return "";
  }

  const number = Number(value);

  if(Number.isNaN(number)){
    return escapeHtml(value);
  }

  return new Intl.NumberFormat("ru-RU",{
    maximumFractionDigits:2
  }).format(number);
}


function currencySymbol(currency){

  switch(currency){
    case "USD":
      return "$";

    case "EUR":
      return "€";

    default:
      return "₽";
  }

}


function formatPrice(value,currency){

  if(value === "" || value === null || value === undefined){
    return "";
  }

  return `${formatNumber(value)} ${currencySymbol(currency)}`;
}


function safeFileName(name){

  let result = String(name || "Коммерческое предложение")
    .replace(/[<>:"/\\|?*\x00-\x1F]/g," ")
    .replace(/\s+/g," ")
    .trim();

  if(!result){
    result = "Коммерческое предложение";
  }

  return `${result}, предложение от АЛЬФАПРОМ`;
}


function parseSpecs(text){

  const rows = [];

  String(text || "")
    .split(/\r?\n/)
    .map(line=>line.trim())
    .filter(Boolean)
    .forEach(line=>{

      const colon = line.indexOf(":");

      if(colon > -1){

        const name = line.slice(0,colon).trim();
        const value = line.slice(colon + 1).trim();

        if(name || value){
          rows.push([name,value]);
        }

      }else{

        rows.push([line,""]);

      }

    });

  return rows;
}


/* ============================================================
   FORM <-> STATE
============================================================ */

const fields = {
  productName: document.getElementById("productName"),
  description: document.getElementById("description"),
  note: document.getElementById("note"),
  price: document.getElementById("price"),
  discountPrice: document.getElementById("discountPrice"),
  currency: document.getElementById("currency"),

function readForm(){

  });

  saveState();
}


function updateStatusButtons(){

============================================================ */

const photoDrop = document.getElementById("photoDrop");
const photoInput = document.getElementById("photoInput");
const choosePhotoBtn = document.getElementById("choosePhotoBtn");
const removePhotoBtn = document.getElementById("removePhotoBtn");


async function renderEditorPhoto(){

  if(!state.photoId){

    photoDrop.classList.remove("has-image");

    photoDrop.innerHTML = `
      <div class="photo-placeholder">
        Нажмите сюда или перетащите фотографию<br>
        <small>Фото автоматически подгоняется под стандартный размер без обрезки</small>
      </div>
    `;

    return;
  }

  const blob = await getPhoto(state.photoId);

  if(!blob){
    state.photoId = "";
    saveState();
    await renderEditorPhoto();
    return;
  }

  const url = URL.createObjectURL(blob);

  photoDrop.classList.add("has-image");

  photoDrop.innerHTML = `
    <img src="${url}" alt="Фото оборудования">
  `;

}


async function handlePhoto(file){

  if(!file || !file.type.startsWith("image/")){
    return;
  }

  if(state.photoId){
    try{
      await deletePhoto(state.photoId);
    }catch(e){}
  }

  const id = await savePhoto(file);

  state.photoId = id;

  saveState();

  await renderEditorPhoto();

  renderPreview();
}


choosePhotoBtn.addEventListener("click",()=>{
  photoInput.click();
});


photoDrop.addEventListener("click",()=>{
  photoInput.click();
});


photoInput.addEventListener("change",async e=>{
  const file = e.target.files[0];

  if(file){
    await handlePhoto(file);
  }

  photoInput.value = "";
});


photoDrop.addEventListener("dragover",e=>{
  e.preventDefault();
  photoDrop.style.borderColor = "var(--orange)";
});


photoDrop.addEventListener("dragleave",()=>{
  photoDrop.style.borderColor = "";
});


photoDrop.addEventListener("drop",async e=>{
  e.preventDefault();
  photoDrop.style.borderColor = "";

  const file = e.dataTransfer.files[0];

  if(file){
    await handlePhoto(file);
  }
});


removePhotoBtn.addEventListener("click",async e=>{
  e.preventDefault();

  if(state.photoId){
    await deletePhoto(state.photoId);
  }

  state.photoId = "";

  saveState();

  await renderEditorPhoto();
  renderPreview();
});

async function getPhotoDataUrl(){

  const blob = await getPhoto(state.photoId);

  if(!blob){
    return "";
  }

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = ()=>{
      resolve(reader.result);
    };

    reader.onerror = ()=>{
      reject(reader.error);
    };

    reader.readAsDataURL(blob);

  });

}

async function downloadPDF(){

  const button = document.getElementById("downloadPdfBtn");

  button.disabled = true;
  button.textContent = "Формирование PDF...";

  try{

    const photoDataUrl = await getPhotoDataUrl();

    const wrapper = document.createElement("div");

    wrapper.style.position = "fixed";
    wrapper.style.left = "-100000px";
    wrapper.style.top = "0";
    wrapper.style.width = "210mm";
    wrapper.style.background = "#fff";

    wrapper.innerHTML = createPageHtml(photoDataUrl);

    document.body.appendChild(wrapper);

    const filename =
      safeFileName(state.productName) +
      ".pdf";

    await html2pdf()
      .set({
        margin:0,
        filename:filename,
        image:{
          type:"jpeg",
          quality:0.98
        },
        html2canvas:{
          scale:2,
          useCORS:true,
          backgroundColor:"#ffffff"
        },
        jsPDF:{
          unit:"mm",
          format:"a4",
          orientation:"portrait"
        },
        pagebreak:{
          mode:["css","legacy"]
        }
      })
      .from(wrapper.querySelector(".kp-page"))
      .save();

    wrapper.remove();

  }catch(error){

    console.error(error);

    alert(
      "Не удалось сформировать PDF.\n\n" +
      (error.message || error)
    );

  }finally{

    button.disabled = false;
    button.textContent = "Скачать PDF";

  }

}

function dataUrlToUint8Array(dataUrl){

  const base64 = dataUrl.split(",")[1];

  const binary = atob(base64);

  const bytes = new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }

  return bytes;
}


async function blobToUint8Array(blob){

  const buffer = await blob.arrayBuffer();

  return new Uint8Array(buffer);

}


function docxText(text,options={}){

  return new docx.TextRun({
    text:String(text || ""),
    ...options
  });

}


function docxParagraph(text,options={}){

  return new docx.Paragraph({
    children:[
      docxText(text,options.text || {})
    ],
    ...options
  });

}

async function downloadDOCX(){

  const button = document.getElementById("downloadDocxBtn");

  button.disabled = true;
  button.textContent = "Формирование DOCX...";

  try{

    const blob = await createDocx();

    const filename =
      safeFileName(state.productName) +
      ".docx";

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;
    link.download = filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    setTimeout(()=>{
      URL.revokeObjectURL(url);
    },1000);

  }catch(error){

    console.error(error);

    alert(
      "Не удалось сформировать DOCX.\n\n" +
      (error.message || error)
    );

  }finally{

    button.disabled = false;
    button.textContent = "Скачать DOCX";

  }

}
