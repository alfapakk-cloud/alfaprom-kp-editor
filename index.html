<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>АЛЬФАПРОМ — редактор КП</title>

<style>
:root{
  --orange:#ff8100;
  --orange-dark:#e66f00;
  --red:#d92727;
  --green:#159447;
  --dark:#222;
  --muted:#777;
  --line:#ddd;
  --bg:#f3f4f6;
  --white:#fff;
}

*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--dark);
}

body{
  min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.topbar{
  position:sticky;
  top:0;
  z-index:100;
  height:64px;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:800;
  letter-spacing:-.3px;
}

.brand-mark{
  width:34px;
  height:34px;
  border-radius:8px;
  background:#fff;
  color:var(--orange);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:900;
}

.brand-name{
  color:#fff;
}

.brand-name span{
  color:#fff;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
}

button{
  font:inherit;
}

.toolbar button{
  border:0;
  border-radius:7px;
  padding:9px 14px;
  cursor:pointer;
  font-weight:700;
}

.btn-white{
  background:#fff;
  color:var(--orange);
}

.btn-dark{
  background:#222;
  color:#fff;
}

.btn-orange{
  background:var(--orange);
  color:#fff;
}

.btn-outline{
  background:#fff;
  border:1px solid var(--line);
  color:#333;
}

.toolbar button:hover{
  opacity:.9;
}

/* =========================
   MAIN
========================= */

.layout{
  width:100%;
  display:grid;
  grid-template-columns:50% 50%;
  min-height:calc(100vh - 64px);
}

/* =========================
   EDITOR
========================= */

.editor-panel{
  min-width:0;
  background:#fff;
  border-right:1px solid var(--line);
  padding:22px;
  overflow-y:auto;
}

.editor-title{
  margin:0 0 18px;
  font-size:24px;
}

.section{
  margin-bottom:22px;
  padding-bottom:20px;
  border-bottom:1px solid #eee;
}

.section:last-child{
  border-bottom:0;
}

.section h2{
  margin:0 0 14px;
  font-size:17px;
}

.field{
  margin-bottom:13px;
}

.field label{
  display:block;
  margin-bottom:6px;
  font-size:13px;
  font-weight:700;
  color:#444;
}

input,
textarea,
select{
  width:100%;
  border:1px solid #ccc;
  border-radius:7px;
  padding:10px 11px;
  font:inherit;
  color:#222;
  background:#fff;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--orange);
  box-shadow:0 0 0 2px rgba(255,129,0,.12);
}

textarea{
  resize:vertical;
  min-height:90px;
}

.specs-textarea{
  min-height:170px;
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}

.hint{
  margin-top:5px;
  color:#888;
  font-size:11px;
  line-height:1.4;
}

/* =========================
   EQUIPMENT CARD EDITOR
========================= */

.equipment-editor{
  border:1px solid #ddd;
  border-radius:10px;
  padding:16px;
  margin-bottom:14px;
  background:#fafafa;
}

.equipment-editor-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.equipment-editor-head strong{
  font-size:15px;
}

.remove-equipment{
  border:0;
  background:#eee;
  color:#777;
  width:30px;
  height:30px;
  border-radius:6px;
  cursor:pointer;
  font-weight:700;
}

.remove-equipment:hover{
  background:#ddd;
}

.add-equipment{
  width:100%;
  border:1px dashed var(--orange);
  color:var(--orange);
  background:#fff;
  border-radius:8px;
  padding:11px;
  cursor:pointer;
  font-weight:700;
}

.price-grid{
  display:grid;
  grid-template-columns:1fr 120px;
  gap:10px;
}

.availability-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.status-switch{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

.status-option{
  border:1px solid #ccc;
  background:#fff;
  padding:9px 7px;
  border-radius:7px;
  text-align:center;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
}

.status-option.active.stock{
  border-color:#9bd4b1;
  background:#edf9f1;
  color:var(--green);
}

.status-option.active.order{
  border-color:#f2c28e;
  background:#fff4e7;
  color:#bd6b00;
}

/* =========================
   PHOTO UPLOAD
========================= */

.photo-drop{
  border:2px dashed #ccc;
  border-radius:9px;
  padding:16px;
  text-align:center;
  color:#777;
  cursor:pointer;
  background:#fff;
}

.photo-drop:hover,
.photo-drop.dragover{
  border-color:var(--orange);
  color:var(--orange);
  background:#fffaf5;
}

.photo-input{
  display:none;
}

.photo-list{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:10px;
}

.photo-item{
  position:relative;
  aspect-ratio:1;
  border-radius:7px;
  overflow:hidden;
  background:#eee;
}

.photo-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.photo-delete{
  position:absolute;
  top:4px;
  right:4px;
  width:24px;
  height:24px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.65);
  color:#fff;
  cursor:pointer;
  font-size:14px;
}

/* =========================
   ADVANTAGES EDITOR
========================= */

.advantages-editor{
  display:grid;
  gap:9px;
}

.advantage-input{
  display:flex;
  align-items:center;
  gap:8px;
}

.advantage-number{
  width:25px;
  height:25px;
  flex:none;
  border-radius:50%;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:700;
}

/* =========================
   PREVIEW
========================= */

.preview-wrap{
  min-width:0;
  background:#dfe1e4;
  padding:24px;
  overflow:auto;
}

.preview-page{
  width:210mm;
  min-height:297mm;
  margin:0 auto;
  background:#fff;
  box-shadow:0 2px 18px rgba(0,0,0,.15);
  overflow:hidden;
}

.preview-header{
  background:var(--orange);
  color:#fff;
  padding:22px 25px 20px;
}

.preview-header-main{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.preview-logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.preview-logo-mark{
  width:44px;
  height:44px;
  border-radius:10px;
  background:#fff;
  color:var(--orange);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
  font-weight:900;
}

.preview-logo-name{

}

.preview-contacts{

}

.preview-contacts strong{
  font-size:12px;
}

.preview-header-links{

  justify-content:flex-end;

.kp-title{

  font-size:29px;

}

.product{
  margin-bottom:30px;
}

.product-name{
  font-size:21px;
  font-weight:800;
  margin:0 0 10px;
}

.product-description{
  font-size:12px;
  line-height:1.55;
  margin-bottom:8px;
}

.product-note{
  font-size:11px;
  color:#666;
  line-height:1.45;
  margin-bottom:14px;
}

.product-photos{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:13px 0 17px;
}

.product-photo{
  width:100%;
  height:145px;
  object-fit:cover;
  border-radius:5px;
  background:#eee;
}

.product-photo.single{
  height:210px;
}

.price-block{
  margin:14px 0 14px;
}

.price-normal{

  font-weight:800;

}

.price-discount{

.price-status{
  margin-top:7px;
  font-size:12px;
  font-weight:800;
}

.price-status.stock{

.price-status.order{

}

.price-comment{

.spec-table{

  margin-top:12px;

.spec-table th,
.spec-table td{
  border:1px solid #ddd;
  padding:7px 8px;
  vertical-align:top;
}

.spec-table th.spec-head{
  background:var(--orange);
  color:#fff;
  text-align:left;
  font-size:11px;
  font-weight:800;
}

.spec-table td:first-child{
  width:40%;

  background:#fafafa;
}

.video-wrap{
  margin-top:15px;
}

.video-button{
  display:inline-block;
  padding:9px 14px;
  border-radius:6px;
  background:#222;
  color:#fff;
  font-size:10px;
  font-weight:700;
  text-decoration:none;
}

/* =========================
   ADVANTAGES
========================= */

.advantages-preview{
  margin:28px 0 0;
  padding:20px 0 22px;
  border-top:1px solid #eee;
}

.advantages-title{
  text-align:center;
  font-size:15px;
  font-weight:800;
  margin-bottom:14px;
}

.advantages-grid{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:10px;
}

.advantage-card{
  grid-column:span 2;
  text-align:center;
  padding:10px 7px;

  line-height:1.35;
  font-weight:700;
}

.advantage-card:nth-child(4){

}

.advantage-card:nth-child(5){
  grid-column:4 / span 2;
}

.advantage-icon{
  width:24px;
  height:24px;
  margin:0 auto 6px;
  border-radius:50%;
  background:var(--orange);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:11px;
  font-weight:800;
}

/* =========================
   FOOTER
========================= */

.preview-footer{
  margin-top:0;
  padding:18px 30px 20px;
  background:var(--orange);
  color:#fff;
}

.footer-main{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
}

.footer-company{
  font-size:15px;
  font-weight:900;
}

.footer-text{
  margin-top:5px;
  font-size:9px;
  line-height:1.45;
  max-width:430px;
}

.footer-manager{
  text-align:right;
  font-size:10px;
  line-height:1.5;
}

.footer-manager strong{
  font-size:12px;
}

.footer-bottom{
  margin-top:10px;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,.35);
  font-size:8px;
  opacity:.9;
}

/* =========================
   EMPTY / LOADING
========================= */

.empty{
  padding:20px;
  text-align:center;
  color:#888;
  font-size:12px;

/* =========================
   PRINT
========================= */

@page{
  size:A4;
  margin:0;
}

@media print{
  body{
    background:#fff;
  }

  .topbar,
  .editor-panel{
    display:none !important;
  }

  .layout{
    display:block;
  }

  .preview-wrap{
    padding:0;
    background:#fff;
    overflow:visible;
  }

  .preview-page{
    width:210mm;
    min-height:297mm;
    margin:0;
    box-shadow:none;
  }
}

/* =========================
   MOBILE
========================= */

@media(max-width:1000px){
  .layout{
    grid-template-columns:1fr;
  }

  .editor-panel{
    border-right:0;
    border-bottom:1px solid var(--line);
  }

  .preview-wrap{
    padding:12px;
  }

  .preview-page{
    transform-origin:top left;
  }
}

@media(max-width:600px){
  .topbar{
    height:auto;
    min-height:60px;
    padding:10px 12px;
    gap:10px;
  }

  .brand{
    font-size:16px;
  }

  .toolbar button{
    padding:8px 9px;
    font-size:11px;
  }

  .editor-panel{
    padding:14px;
  }

  }

  .photo-list{
    grid-template-columns:repeat(3,1fr);
  }

    overflow-x:auto;
  }

</style>

<body>

<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">
  <div class="brand">
    <div class="brand-mark">А</div>
    <div class="brand-name">АЛЬФАПРОМ · Редактор КП</div>
  </div>

  <div class="toolbar">
    <button class="btn-white" onclick="resetProposal()">Сбросить</button>
    <button class="btn-dark" onclick="exportDOC()">DOC</button>

  </div>
</header>

<div class="layout">

  <!-- =========================
       EDITOR
  ========================= -->

  <aside class="editor-panel">

    <h1 class="editor-title">Настройки КП</h1>

    <div class="section">
      <h2>Основная информация</h2>

      <div class="field">
        <label>Название коммерческого предложения</label>
        <input id="kpTitle" type="text">
      </div>

      <div class="field">
        <label>Имя менеджера</label>
        <input id="managerName" type="text" placeholder="Например: Иван Иванов">
      </div>

      <div class="field">
        <label>Телефон менеджера</label>
        <input id="managerPhone" type="text" placeholder="+7 900 000-00-00">
      </div>

      <div class="field">
        <label>Видео / YouTube / Rutube</label>
        <input id="globalVideo" type="text" placeholder="https://...">

      </button>

      <div class="hint" style="margin-bottom:10px">
        Эти 5 пунктов выводятся перед подвалом. Их можно менять для каждого КП.
      </div>

<script>
/* =========================================================
   CONFIG
========================================================= */

const STORAGE_KEY = 'alfaprom_kp_editor_v2';
const DB_NAME = 'alfaprom_kp_editor_images';
const DB_VERSION = 1;
const PHOTO_STORE = 'photos';

let state;
let db = null;
const objectUrlCache = new Map();


/* =========================================================
   DEFAULT STATE
========================================================= */

function getDefaultState(){
  return {
    kpTitle: 'Коммерческое предложение',
    managerName: '',
    managerPhone: '',
    globalVideo: '',
    footerText: 'Будем рады подобрать оптимальное решение под вашу задачу.',
    
    advantages: [
      'На рынке с 2017 г.',
      'Нам доверяют крупные федеральные заказчики',
      'Не продаем «железо», а решаем задачу под ключ',
      'ОСЗ (Оперативная Служба Заботы) - реагирование сервиса в течении 5 минут!',
      'ГЛЦ (Гарантия Лучшей Цены)'
    ],

    equipment: [
      {
        name: 'Пельменный аппарат Foodatlas JGL120-5B',
        description: 'Профессиональный автоматический аппарат для производства пельменей.',
        note: '',
        price: '200890',
        discountPrice: '',
        currency: 'RUB',
        availability: 'stock',
        priceComment: '',
        specsText:
`Производительность: до 120 кг/ч
Вес: 160 кг
Габариты: 990 × 470 × 1150 мм
Мощность: 1,5 кВт`,
        photos: []
      }
    ]
  };
}


/* =========================================================
   INDEXED DB
========================================================= */

function openImageDB(){
  return new Promise((resolve,reject)=>{
    const request = indexedDB.open(DB_NAME, DB_VERSION);

    request.onupgradeneeded = function(e){
      const database = e.target.result;

      if(!database.objectStoreNames.contains(PHOTO_STORE)){
        database.createObjectStore(PHOTO_STORE, {
          keyPath:'id'
        });
      }
    };

    request.onsuccess = function(e){
      db = e.target.result;
      resolve(db);
    };

    request.onerror = function(){
      reject(request.error);
    };
  });
}


function photoPut(id, blob){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readwrite');
    const store = tx.objectStore(PHOTO_STORE);

    store.put({
      id:id,
      blob:blob
    });

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}


function photoGet(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readonly');
    const store = tx.objectStore(PHOTO_STORE);
    const request = store.get(id);

    request.onsuccess = ()=>resolve(request.result || null);
    request.onerror = ()=>reject(request.error);
  });
}


function photoDelete(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readwrite');
    const store = tx.objectStore(PHOTO_STORE);

    store.delete(id);

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}


function photoClear(){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(PHOTO_STORE,'readwrite');
    const store = tx.objectStore(PHOTO_STORE);

    store.clear();

    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}


function createPhotoId(){
  if(window.crypto && crypto.randomUUID){
    return crypto.randomUUID();
  }

  return 'photo_' + Date.now() + '_' + Math.random().toString(36).slice(2);
}


/* =========================================================
   IMAGE HELPERS
========================================================= */

function dataURLToBlob(dataURL){
  const parts = dataURL.split(',');
  const mime = parts[0].match(/:(.*?);/)[1];
  const binary = atob(parts[1]);

  const bytes = new Uint8Array(binary.length);

  for(let i=0;i<binary.length;i++){
    bytes[i] = binary.charCodeAt(i);
  }

  return new Blob([bytes], {type:mime});
}


async function getPhotoURL(id){
  if(!id) return '';

  if(objectUrlCache.has(id)){
    return objectUrlCache.get(id);
  }

  const item = await photoGet(id);

  if(!item) return '';

  const url = URL.createObjectURL(item.blob);

  objectUrlCache.set(id,url);

  return url;
}


function revokeAllObjectURLs(){
  for(const url of objectUrlCache.values()){
    URL.revokeObjectURL(url);
  }

  objectUrlCache.clear();
}


/* =========================================================
   MIGRATION FROM V1
========================================================= */

async function migrateOldPhotos(){
  let changed = false;

  for(const equipment of state.equipment || []){
    if(!Array.isArray(equipment.photos)) continue;

    const migratedPhotos = [];

    for(const photo of equipment.photos){

      if(typeof photo === 'string' && photo.startsWith('data:')){
        const id = createPhotoId();
        const blob = dataURLToBlob(photo);

        await photoPut(id,blob);

        migratedPhotos.push(id);
        changed = true;

      }else{
        migratedPhotos.push(photo);
      }
    }

    equipment.photos = migratedPhotos;
  }

  if(changed){
    saveState();
  }
}


/* =========================================================
   STATE
========================================================= */

function saveState(){
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(state)
  );
}


function loadState(){
  const saved =
    localStorage.getItem(STORAGE_KEY) ||
    localStorage.getItem('alfaprom_kp_editor_v1');

  if(!saved){
    state = getDefaultState();
    return;
  }

  try{
    state = JSON.parse(saved);
  }catch{
    state = getDefaultState();
  }

  normalizeState();
}


function normalizeState(){

  if(!state || typeof state !== 'object'){
    state = getDefaultState();
    return;
  }

  if(!Array.isArray(state.equipment)){
    state.equipment = [];
  }

  if(!Array.isArray(state.advantages)){
    state.advantages = getDefaultState().advantages;
  }

  if(state.kpTitle === undefined) state.kpTitle = '';
  if(state.managerName === undefined) state.managerName = '';
  if(state.managerPhone === undefined) state.managerPhone = '';
  if(state.globalVideo === undefined) state.globalVideo = '';
  if(state.footerText === undefined) state.footerText = '';

  state.equipment.forEach(equipment=>{
    if(!Array.isArray(equipment.photos)){
      equipment.photos = [];
    }

    if(equipment.discountPrice === undefined){
      equipment.discountPrice = '';
    }

    if(equipment.currency === undefined){
      equipment.currency = 'RUB';
    }

    if(equipment.availability === undefined){
      equipment.availability = 'stock';
    }

    if(equipment.priceComment === undefined){
      equipment.priceComment = '';
    }

    /*
      Миграция старого массива specs
      в единое поле specsText.
    */
    if(equipment.specsText === undefined){

      if(Array.isArray(equipment.specs)){
        equipment.specsText = equipment.specs
          .map(spec=>{
            if(typeof spec === 'string') return spec;

            if(spec && spec.name){
              return spec.name + ': ' + (spec.value || '');
            }

            return '';
          })
          .filter(Boolean)
          .join('\n');

      }else{
        equipment.specsText = '';
      }
    }
  });
}


/* =========================================================
   FORMATTERS
========================================================= */

function currencySymbol(currency){
  if(currency === 'USD') return '$';
  if(currency === 'EUR') return '€';
  return '₽';
}


function formatPrice(value){
  if(value === undefined || value === null) return '';

  const clean = String(value)
    .replace(/\s/g,'')
    .replace(',', '.');

  const number = Number(clean);

  if(!Number.isFinite(number)){
    return String(value);
  }

  return new Intl.NumberFormat('ru-RU',{
    maximumFractionDigits:2
  }).format(number);
}


function parseSpecs(text){

  if(!text) return [];

  return text
    .split(/\r?\n/)
    .map(line=>line.trim())
    .filter(Boolean)
    .map(line=>{

      /*
        Поддерживаются варианты:

        Вес: 160 кг
        Вес — 160 кг
        Вес - 160 кг
        Вес    160 кг
      */

      let match = line.match(/^(.+?)\s*:\s*(.+)$/);

      if(!match){
        match = line.match(/^(.+?)\s+[—-]\s+(.+)$/);
      }

      if(!match){
        match = line.match(/^(.+?)\t+(.+)$/);
      }

      if(match){
        return {
          name:match[1].trim(),
          value:match[2].trim()
        };
      }

      return {
        name:'',
        value:line
      };
    });
}

async function removeEquipment(index){

  if(!equipment) return;

    if(typeof id === 'string' && !id.startsWith('data:')){

  }

/* =========================================================
   PHOTOS
========================================================= */

function handleDragOver(event){
  event.preventDefault();
  event.currentTarget.classList.add('dragover');
}


function handleDragLeave(event){
  event.currentTarget.classList.remove('dragover');
}


function handlePhotoDrop(event,index){

  event.preventDefault();
  event.currentTarget.classList.remove('dragover');

  const files = [...event.dataTransfer.files]
    .filter(file=>file.type.startsWith('image/'));

  addPhotos(files,index);
}


function handlePhotoInput(event,index){

  const files = [...event.target.files];

  addPhotos(files,index);

  event.target.value = '';
}


async function addPhotos(files,index){

  if(!state.equipment[index]) return;

  for(const file of files){

    if(!file.type.startsWith('image/')) continue;

    const id = createPhotoId();

    await photoPut(id,file);

    state.equipment[index].photos.push(id);
  }

  saveState();

  renderEquipmentEditor();
  renderPreview();
}


async function deletePhoto(equipmentIndex,photoIndex){

  const equipment = state.equipment[equipmentIndex];

  if(!equipment) return;

  const id = equipment.photos[photoIndex];

  if(id){
    try{
      await photoDelete(id);
    }catch{}
  }

  if(objectUrlCache.has(id)){
    URL.revokeObjectURL(objectUrlCache.get(id));
    objectUrlCache.delete(id);
  }

  equipment.photos.splice(photoIndex,1);

  saveState();

  renderEquipmentEditor();
  renderPreview();
}


async function renderPhotoList(index){

/* =========================================================
   DOC EXPORT
========================================================= */

async function exportDOC(){

  /*
    Для DOC изображения из IndexedDB
    преобразуются обратно в data URL,
    чтобы Word получил сам файл изображения,
    а не ссылку на локальный blob.
  */

  const previewClone =
    document.getElementById('preview').cloneNode(true);

  const images =
    [...previewClone.querySelectorAll('img')];

  for(const img of images){

    const src = img.getAttribute('src');

    if(!src) continue;

    if(src.startsWith('blob:')){

      const id =
        [...objectUrlCache.entries()]
          .find(([key,value])=>value === src)?.[0];

      if(id){

        const item =
          await photoGet(id);

        if(item){

          const dataURL =
            await blobToDataURL(item.blob);

          img.setAttribute('src',dataURL);
        }
      }
    }
  }


  const styles =
    [...document.querySelectorAll('style')]
      .map(style=>style.innerHTML)
      .join('\n');


  const html = `
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>${escapeHTML(state.kpTitle || 'Коммерческое предложение')}</title>
<style>
${styles}

body{
  background:#fff !important;
}

.preview-page{
  width:210mm !important;
  min-height:297mm !important;
  margin:0 !important;
  box-shadow:none !important;
}

.preview-header,
.preview-footer,
.spec-table th.spec-head,
.advantage-icon{
  -webkit-print-color-adjust:exact;
  print-color-adjust:exact;
}
</style>
</head>

<body>

${previewClone.outerHTML}

</body>
</html>
  `;


  const blob =
    new Blob(
      ['\ufeff',html],
      {
        type:'application/msword'
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement('a');

  a.href = url;

  a.download =
    safeFilename(
      state.kpTitle || 'Коммерческое предложение'
    ) + '.doc';

  document.body.appendChild(a);

  a.click();

  a.remove();

  setTimeout(()=>{
    URL.revokeObjectURL(url);
  },1000);
}


function blobToDataURL(blob){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onloadend = ()=>{
      resolve(reader.result);
    };

    reader.onerror = reject;

    reader.readAsDataURL(blob);
  });
}

/* =========================================================
   UTILS
========================================================= */

function escapeHTML(value){

  return String(value ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}


function escapeAttribute(value){
  return escapeHTML(value);
}


function nl2br(value){
  return String(value || '').replace(/\n/g,'<br>');
}


function safeFilename(value){

  return String(value || 'Коммерческое предложение')
    .replace(/[<>:"/\\|?*]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,100);
}
